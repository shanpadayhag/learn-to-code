<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="638" height="378" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="40" font-size="19" font-weight="700" fill="#1f2328"><tspan font-family="ui-monospace,monospace">slot.take()</tspan> — move the value out, leave a valid <tspan font-family="ui-monospace,monospace" fill="#b02a37">None</tspan></text>
  <text x="32" y="63" font-size="13.5" fill="#57606a">the variable is never left broken — it just becomes an empty Option you can keep using</text>

  <!-- BEFORE -->
  <text x="150" y="108" font-size="13" font-weight="700" fill="#57606a" text-anchor="middle">before</text>
  <rect x="60" y="122" width="180" height="70" rx="10" fill="#eef4ff" stroke="#4c8dff" stroke-width="2"/>
  <text x="150" y="147" font-size="13" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace">slot</text>
  <rect x="90" y="152" width="120" height="30" rx="7" fill="#d7f5dd" stroke="#3fa45b" stroke-width="2"/>
  <text x="150" y="172" font-size="13" font-family="ui-monospace,monospace" fill="#1a7f37" text-anchor="middle">Some("coffee")</text>

  <!-- arrow -->
  <text x="320" y="162" font-size="15" fill="#8a94a0" text-anchor="middle" font-family="ui-monospace,monospace">.take()</text>
  <line x1="255" y1="167" x2="385" y2="167" stroke="#8a94a0" stroke-width="2" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a94a0"/>
    </marker>
  </defs>

  <!-- AFTER: slot -->
  <text x="490" y="108" font-size="13" font-weight="700" fill="#57606a" text-anchor="middle">after</text>
  <rect x="400" y="122" width="180" height="70" rx="10" fill="#eef4ff" stroke="#4c8dff" stroke-width="2"/>
  <text x="490" y="147" font-size="13" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace">slot</text>
  <rect x="430" y="152" width="120" height="30" rx="7" fill="#ffe3e3" stroke="#d1666b" stroke-width="2"/>
  <text x="490" y="172" font-size="13" font-family="ui-monospace,monospace" fill="#b02a37" text-anchor="middle">None</text>

  <!-- the taken value drops out -->
  <path d="M150 200 C150 240, 300 250, 300 285" fill="none" stroke="#3fa45b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arg)"/>
  <defs>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3fa45b"/>
    </marker>
  </defs>
  <rect x="220" y="292" width="200" height="34" rx="8" fill="#d7f5dd" stroke="#3fa45b" stroke-width="2"/>
  <text x="320" y="314" font-size="13" font-family="ui-monospace,monospace" fill="#1a7f37" text-anchor="middle">taken = Some("coffee")</text>

  <text x="320" y="356" font-size="13" fill="#57606a" text-anchor="middle"><tspan font-weight="700" fill="#1f2328">.as_ref()</tspan> / <tspan font-weight="700" fill="#1f2328">.as_mut()</tspan> instead <tspan font-style="italic">borrow</tspan> the inside — the value never leaves the mug</text>
</svg>
