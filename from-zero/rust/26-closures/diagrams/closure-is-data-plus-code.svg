<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="678" height="378" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="38" font-size="19" font-weight="700" fill="#1f2328">A closure is secretly a struct: captured data + code</text>
  <text x="32" y="61" font-size="13.5" fill="#57606a">when a closure uses a variable from around it, it <tspan font-weight="700" fill="#1f2328">stores</tspan> that variable inside itself</text>

  <!-- the source -->
  <text x="40" y="102" font-size="13" font-weight="700" fill="#57606a">you write:</text>
  <rect x="40" y="114" width="270" height="90" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="58" y="144" font-size="13.5" font-family="ui-monospace,monospace" fill="#1f2328">let factor = 3;</text>
  <text x="58" y="172" font-size="13.5" font-family="ui-monospace,monospace" fill="#1f2328">let scale = |x| x * <tspan fill="#8250df" font-weight="700">factor</tspan>;</text>
  <text x="58" y="194" font-size="11.5" fill="#57606a">`factor` comes from outside the closure</text>

  <!-- arrow -->
  <text x="330" y="165" font-size="26" fill="#57606a">→</text>

  <!-- the compiler builds -->
  <text x="372" y="102" font-size="13" font-weight="700" fill="#57606a">the compiler builds (roughly):</text>
  <rect x="372" y="114" width="276" height="150" rx="8" fill="#fff" stroke="#4a7fd6" stroke-width="1.5"/>
  <!-- data part -->
  <rect x="388" y="128" width="244" height="44" rx="6" fill="#efe8ff" stroke="#8250df" stroke-width="1.5"/>
  <text x="400" y="147" font-size="11" fill="#8250df" font-family="ui-monospace,monospace">captured data</text>
  <text x="400" y="165" font-size="13" font-family="ui-monospace,monospace" fill="#1f2328">factor: 3</text>
  <!-- code part -->
  <rect x="388" y="180" width="244" height="70" rx="6" fill="#dbe9ff" stroke="#4a7fd6" stroke-width="1.5"/>
  <text x="400" y="199" font-size="11" fill="#0b3d91" font-family="ui-monospace,monospace">code to run</text>
  <text x="400" y="220" font-size="13" font-family="ui-monospace,monospace" fill="#1f2328">call(x) = x * self.factor</text>
  <text x="400" y="240" font-size="11.5" fill="#57606a">an unnamed one-off type</text>

  <line x1="32" y1="292" x2="648" y2="292" stroke="#e1e4e8"/>
  <text x="32" y="317" font-size="12.5" fill="#57606a">Calling <tspan font-family="ui-monospace,monospace">scale(10)</tspan> runs the code with its stored <tspan font-family="ui-monospace,monospace">factor</tspan> → <tspan font-family="ui-monospace,monospace">10 * 3 = 30</tspan>.</text>
  <text x="32" y="341" font-size="12.5" fill="#57606a">A plain <tspan font-family="ui-monospace,monospace">fn</tspan> has no "captured data" box — that's exactly why it can't see <tspan font-family="ui-monospace,monospace">factor</tspan>.</text>
  <text x="32" y="365" font-size="12.5" fill="#57606a">Each closure is its own type, so the call is a <tspan font-weight="700" fill="#1f2328">direct jump</tspan> — no runtime overhead vs a hand-written loop.</text>
</svg>
