<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="658" height="338" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="42" font-size="20" font-weight="700" fill="#1f2328">name.push_str("ie");  — the text grows</text>
  <text x="32" y="66" font-size="14" fill="#57606a">the stack handle stays put; only the heap buffer and the numbers in the handle change</text>

  <!-- before -->
  <text x="150" y="104" font-size="13" fill="#1f2328" font-weight="700" text-anchor="middle">before</text>
  <rect x="60" y="118" width="180" height="72" rx="10" fill="#fff4e6" stroke="#d98a2b" stroke-width="2"/>
  <g font-family="ui-monospace, monospace" font-weight="700" font-size="20" fill="#a35a05" text-anchor="middle">
    <rect x="76" y="134" width="38" height="40" rx="5" fill="#ffe0c2" stroke="#d98a2b"/><text x="95" y="162">A</text>
    <rect x="118" y="134" width="38" height="40" rx="5" fill="#ffe0c2" stroke="#d98a2b"/><text x="137" y="162">n</text>
    <rect x="160" y="134" width="38" height="40" rx="5" fill="#ffe0c2" stroke="#d98a2b"/><text x="179" y="162">n</text>
  </g>
  <text x="150" y="212" font-size="13" fill="#57606a" text-anchor="middle" font-family="ui-monospace, monospace">len 3 · capacity 3</text>

  <!-- arrow -->
  <line x1="270" y1="154" x2="360" y2="154" stroke="#8a929c" stroke-width="2"/>
  <polygon points="360,154 349,148 349,160" fill="#8a929c"/>
  <text x="315" y="142" font-size="12" fill="#57606a" text-anchor="middle">out of room →</text>
  <text x="315" y="176" font-size="11" fill="#57606a" text-anchor="middle">reserve bigger,</text>
  <text x="315" y="190" font-size="11" fill="#57606a" text-anchor="middle">copy over</text>

  <!-- after -->
  <text x="510" y="104" font-size="13" fill="#1f2328" font-weight="700" text-anchor="middle">after</text>
  <rect x="386" y="118" width="248" height="72" rx="10" fill="#fff4e6" stroke="#d98a2b" stroke-width="2"/>
  <g font-family="ui-monospace, monospace" font-weight="700" font-size="20" fill="#a35a05" text-anchor="middle">
    <rect x="402" y="134" width="38" height="40" rx="5" fill="#ffe0c2" stroke="#d98a2b"/><text x="421" y="162">A</text>
    <rect x="444" y="134" width="38" height="40" rx="5" fill="#ffe0c2" stroke="#d98a2b"/><text x="463" y="162">n</text>
    <rect x="486" y="134" width="38" height="40" rx="5" fill="#ffe0c2" stroke="#d98a2b"/><text x="505" y="162">n</text>
    <rect x="528" y="134" width="38" height="40" rx="5" fill="#ffd7a8" stroke="#d98a2b"/><text x="547" y="162">i</text>
    <rect x="570" y="134" width="38" height="40" rx="5" fill="#ffd7a8" stroke="#d98a2b"/><text x="589" y="162">e</text>
  </g>
  <text x="510" y="212" font-size="13" fill="#57606a" text-anchor="middle" font-family="ui-monospace, monospace">len 5 · capacity 5+</text>

  <line x1="32" y1="252" x2="628" y2="252" stroke="#e1e4e8"/>
  <text x="32" y="282" font-size="13" fill="#57606a">If the new text fits in the reserved <tspan font-weight="700" fill="#1f2328">capacity</tspan>, Rust just writes it in and bumps <tspan font-weight="700" fill="#1f2328">len</tspan>.</text>
  <text x="32" y="306" font-size="13" fill="#57606a">If it doesn't fit, Rust reserves a bigger heap chunk, copies the old bytes over, and updates <tspan font-weight="700" fill="#1f2328">ptr</tspan>.</text>
</svg>
