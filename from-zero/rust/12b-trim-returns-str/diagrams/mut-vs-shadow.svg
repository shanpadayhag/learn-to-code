<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="718" height="358" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="40" font-size="19" font-weight="700" fill="#1f2328">Same-looking code, different memory</text>

  <!-- divider -->
  <line x1="360" y1="64" x2="360" y2="336" stroke="#e1e4e8"/>

  <!-- LEFT: mut -->
  <text x="40" y="90" font-size="14" font-weight="700" fill="#4a7fd6" font-family="ui-monospace,monospace">let mut x = 5;</text>
  <text x="40" y="112" font-size="14" font-weight="700" fill="#4a7fd6" font-family="ui-monospace,monospace">x = 6;</text>
  <text x="40" y="138" font-size="13" fill="#57606a">reuse the <tspan font-weight="700" fill="#1f2328">same box</tspan> — overwrite in place</text>

  <rect x="120" y="170" width="120" height="60" rx="8" fill="#dbe9ff" stroke="#4a7fd6" stroke-width="2"/>
  <text x="180" y="162" font-size="12" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace">x</text>
  <text x="180" y="198" font-size="22" font-weight="700" fill="#8a929c" text-anchor="middle" font-family="ui-monospace,monospace" text-decoration="line-through">5</text>
  <text x="180" y="222" font-size="22" font-weight="700" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,monospace">6</text>
  <text x="40" y="300" font-size="12.5" fill="#4a7fd6">One slot. The 5 is gone. Type can't change.</text>

  <!-- RIGHT: shadow -->
  <text x="392" y="90" font-size="14" font-weight="700" fill="#0b6b3a" font-family="ui-monospace,monospace">let x = 5;</text>
  <text x="392" y="112" font-size="14" font-weight="700" fill="#0b6b3a" font-family="ui-monospace,monospace">let x = "five";</text>
  <text x="392" y="138" font-size="13" fill="#57606a">a <tspan font-weight="700" fill="#1f2328">brand-new box</tspan> that reuses the name</text>

  <rect x="440" y="170" width="110" height="60" rx="8" fill="#eef1f4" stroke="#c4ccd4" stroke-width="2"/>
  <text x="495" y="162" font-size="12" fill="#8a929c" text-anchor="middle" font-family="ui-monospace,monospace">x (hidden)</text>
  <text x="495" y="208" font-size="22" font-weight="700" fill="#8a929c" text-anchor="middle" font-family="ui-monospace,monospace">5</text>

  <rect x="574" y="170" width="110" height="60" rx="8" fill="#eafbea" stroke="#3f9d63" stroke-width="2"/>
  <text x="629" y="162" font-size="12" fill="#0b6b3a" text-anchor="middle" font-family="ui-monospace,monospace">x</text>
  <text x="629" y="208" font-size="18" font-weight="700" fill="#0b6b3a" text-anchor="middle" font-family="ui-monospace,monospace">"five"</text>

  <text x="392" y="278" font-size="12.5" fill="#0b6b3a">Two slots, both still in memory. The name just</text>
  <text x="392" y="296" font-size="12.5" fill="#0b6b3a">points at the newer one — and its type may differ.</text>
  <text x="392" y="322" font-size="11.5" fill="#8a929c">(the old i32 slot lives on until the scope ends)</text>
</svg>
