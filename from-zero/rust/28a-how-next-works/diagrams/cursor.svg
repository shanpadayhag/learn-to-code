<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="718" height="378" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="38" font-size="19" font-weight="700" fill="#1f2328">An iterator is a cursor: one position, walking a buffer</text>
  <text x="32" y="61" font-size="13.5" fill="#57606a">"flower".bytes() stores only WHERE it is — it never copies the letters</text>

  <!-- the string buffer -->
  <text x="32" y="104" font-size="12.5" font-weight="700" fill="#8250df">the string's bytes (shared, never copied)</text>
  <g font-family="ui-monospace,monospace">
    <rect x="60"  y="116" width="70" height="46" rx="6" fill="#eef2f6" stroke="#8c959f"/>
    <rect x="130" y="116" width="70" height="46" rx="6" fill="#eef2f6" stroke="#8c959f"/>
    <rect x="200" y="116" width="70" height="46" rx="6" fill="#eef2f6" stroke="#8c959f"/>
    <rect x="270" y="116" width="70" height="46" rx="6" fill="#fff3d6" stroke="#d98f3f" stroke-width="2"/>
    <rect x="340" y="116" width="70" height="46" rx="6" fill="#eef2f6" stroke="#8c959f"/>
    <rect x="410" y="116" width="70" height="46" rx="6" fill="#eef2f6" stroke="#8c959f"/>
    <text x="95"  y="145" font-size="17" fill="#1f2328" text-anchor="middle">f</text>
    <text x="165" y="145" font-size="17" fill="#1f2328" text-anchor="middle">l</text>
    <text x="235" y="145" font-size="17" fill="#1f2328" text-anchor="middle">o</text>
    <text x="305" y="145" font-size="17" fill="#9a5a00" text-anchor="middle" font-weight="700">w</text>
    <text x="375" y="145" font-size="17" fill="#1f2328" text-anchor="middle">e</text>
    <text x="445" y="145" font-size="17" fill="#1f2328" text-anchor="middle">r</text>
    <!-- byte indices -->
    <text x="95"  y="178" font-size="11" fill="#8c959f" text-anchor="middle">0</text>
    <text x="165" y="178" font-size="11" fill="#8c959f" text-anchor="middle">1</text>
    <text x="235" y="178" font-size="11" fill="#8c959f" text-anchor="middle">2</text>
    <text x="305" y="178" font-size="11" fill="#8c959f" text-anchor="middle">3</text>
    <text x="375" y="178" font-size="11" fill="#8c959f" text-anchor="middle">4</text>
    <text x="445" y="178" font-size="11" fill="#8c959f" text-anchor="middle">5</text>
  </g>

  <!-- position pointer -->
  <line x1="305" y1="230" x2="305" y2="168" stroke="#d98f3f" stroke-width="2.5" marker-end="url(#ah)"/>
  <rect x="250" y="232" width="112" height="30" rx="6" fill="#fff3d6" stroke="#d98f3f"/>
  <text x="306" y="252" font-size="12.5" fill="#9a5a00" text-anchor="middle" font-family="ui-monospace,monospace">position: 3</text>

  <!-- what next() does -->
  <text x="500" y="104" font-size="12.5" font-weight="700" fill="#1a7f37">one call to .next()</text>
  <rect x="500" y="116" width="196" height="126" rx="8" fill="#eaf6ee" stroke="#3fa45b"/>
  <text x="514" y="141" font-size="12.5" fill="#1a7f37">1. read the byte HERE</text>
  <text x="514" y="161" font-size="12.5" fill="#57606a" font-family="ui-monospace,monospace">     → 'w' (119)</text>
  <text x="514" y="185" font-size="12.5" fill="#1a7f37">2. move position forward</text>
  <text x="514" y="205" font-size="12.5" fill="#57606a" font-family="ui-monospace,monospace">     3 → 4</text>
  <text x="514" y="229" font-size="12.5" fill="#1a7f37">3. hand it back:</text>
  <text x="514" y="229" font-size="12.5" fill="#1a7f37"><tspan x="620" y="229" font-family="ui-monospace,monospace" fill="#57606a">Some(119)</tspan></text>

  <line x1="32" y1="292" x2="688" y2="292" stroke="#d0d7de"/>
  <text x="32" y="318" font-size="12.5" fill="#57606a">The whole iterator is just <tspan font-weight="700" fill="#1f2328">a reference to the bytes + one number (the position)</tspan> — no second copy of "flower".</text>
  <text x="32" y="340" font-size="12.5" fill="#57606a">When <tspan font-weight="700" fill="#1f2328">position reaches 6</tspan> (past the last byte), there's nothing left to read, so .next() hands back <tspan font-family="ui-monospace,monospace" fill="#a40e26">None</tspan> —</text>
  <text x="32" y="362" font-size="12.5" fill="#57606a">that <tspan font-family="ui-monospace,monospace" fill="#a40e26">None</tspan> is the "the stream is empty now" signal a <tspan font-weight="700" fill="#1f2328">for</tspan> loop watches for to stop.</text>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d98f3f"/></marker>
  </defs>
</svg>
