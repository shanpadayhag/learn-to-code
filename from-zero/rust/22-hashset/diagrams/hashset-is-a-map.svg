<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="428" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="40" font-size="20" font-weight="700" fill="#1f2328">A HashSet is a HashMap that stores only keys</text>
  <text x="32" y="64" font-size="13" fill="#57606a">HashSet&lt;T&gt; = HashMap&lt;T, ()&gt;. The value is (), which takes 0 bytes — so each slot holds just the key.</text>

  <!-- key + hash -->
  <rect x="36" y="150" width="120" height="46" rx="8" fill="#e7e0ff" stroke="#8a63d2" stroke-width="2"/>
  <text x="96" y="178" font-size="14" fill="#5a3ea8" text-anchor="middle">insert(7)</text>

  <rect x="200" y="150" width="120" height="46" rx="8" fill="#fff3cf" stroke="#d9b23d" stroke-width="2"/>
  <text x="260" y="172" font-size="12" fill="#8a6d1d" text-anchor="middle">hash(7)</text>
  <text x="260" y="188" font-size="11" fill="#8a6d1d" text-anchor="middle">→ slot 2</text>

  <line x1="156" y1="173" x2="198" y2="173" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="320" y1="173" x2="392" y2="173" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- bucket array -->
  <text x="520" y="112" font-size="12" fill="#57606a" text-anchor="middle">THE BUCKET ARRAY (on the heap)</text>
  <g font-size="12.5" font-family="ui-monospace,monospace">
    <rect x="400" y="124" width="240" height="34" rx="6" fill="#eef1f4" stroke="#c4ccd4"/>
    <text x="414" y="146" fill="#57606a">slot 0 · empty</text>
    <rect x="400" y="160" width="240" height="34" rx="6" fill="#d9f2e6" stroke="#3aa06a" stroke-width="2"/>
    <text x="414" y="182" fill="#1d6b45">slot 2 · key 7 | value ()  ← 0 bytes</text>
    <rect x="400" y="196" width="240" height="34" rx="6" fill="#d9f2e6" stroke="#3aa06a" stroke-width="2"/>
    <text x="414" y="218" fill="#1d6b45">slot 3 · key 4 | value ()</text>
    <rect x="400" y="232" width="240" height="34" rx="6" fill="#eef1f4" stroke="#c4ccd4"/>
    <text x="414" y="254" fill="#57606a">slot 4 · empty</text>
  </g>

  <text x="32" y="316" font-size="13" fill="#1f2328" font-weight="600">The value column is physically nothing — so a set is "just the keys of a map."</text>
  <text x="32" y="342" font-size="12.5" fill="#57606a">contains(&amp;7): hash 7 → jump to slot 2 → is 7 there?  One hop, ~O(1). No scanning the whole array.</text>
  <text x="32" y="366" font-size="12.5" fill="#57606a">No duplicates &amp; no order come for free: a map already keeps one entry per key, placed by its hash.</text>
  <text x="32" y="392" font-size="12" fill="#8a5a1d">Contrast: a Vec would compare element after element — O(n) per check.</text>
</svg>
