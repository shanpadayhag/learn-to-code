<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="678" height="428" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="40" font-size="19" font-weight="700" fill="#1f2328"><tspan font-family="ui-monospace,monospace">Weak&lt;T&gt;</tspan> — a handle that points without owning</text>
  <text x="32" y="63" font-size="13.5" fill="#57606a">the <tspan font-weight="700" fill="#8250df">strong</tspan> count keeps the value alive · the <tspan font-weight="700" fill="#0969da">weak</tspan> count does not</text>

  <defs>
    <marker id="wStrong" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8250df"/>
    </marker>
    <marker id="wWeak" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0969da"/>
    </marker>
  </defs>

  <!-- parent node -->
  <text x="150" y="110" font-size="12.5" font-weight="700" fill="#57606a" text-anchor="middle">parent (an Rc)</text>
  <rect x="60" y="122" width="180" height="96" rx="12" fill="#efe6ff" stroke="#8250df" stroke-width="2"/>
  <rect x="80" y="140" width="140" height="26" rx="6" fill="#fff" stroke="#8250df" stroke-width="1.5"/>
  <text x="94" y="158" font-size="11.5" fill="#8250df">strong count:</text>
  <text x="208" y="158" font-size="12" font-weight="700" font-family="ui-monospace,monospace" fill="#8250df" text-anchor="end">1</text>
  <rect x="80" y="172" width="140" height="26" rx="6" fill="#eaf2fb" stroke="#0969da" stroke-width="1.5"/>
  <text x="94" y="190" font-size="11.5" fill="#0969da">weak count:</text>
  <text x="208" y="190" font-size="12" font-weight="700" font-family="ui-monospace,monospace" fill="#0969da" text-anchor="end">1</text>

  <!-- child node -->
  <text x="530" y="110" font-size="12.5" font-weight="700" fill="#57606a" text-anchor="middle">child (an Rc)</text>
  <rect x="440" y="122" width="180" height="96" rx="12" fill="#efe6ff" stroke="#8250df" stroke-width="2"/>
  <text x="530" y="176" font-size="13" font-family="ui-monospace,monospace" fill="#8250df" text-anchor="middle">value</text>

  <!-- parent owns child: solid strong arrow -->
  <line x1="240" y1="150" x2="440" y2="150" stroke="#8250df" stroke-width="2.5" marker-end="url(#wStrong)"/>
  <text x="340" y="140" font-size="12" font-weight="700" fill="#8250df" text-anchor="middle">Rc — owns</text>
  <text x="340" y="167" font-size="10.5" fill="#57606a" text-anchor="middle">+1 strong · keeps child alive</text>

  <!-- child points back at parent: dashed weak arrow -->
  <line x1="440" y1="196" x2="240" y2="196" stroke="#0969da" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#wWeak)"/>
  <text x="340" y="214" font-size="12" font-weight="700" fill="#0969da" text-anchor="middle">Weak — points, doesn't own</text>

  <!-- the two rules -->
  <rect x="60" y="256" width="560" height="66" rx="10" fill="#fff" stroke="#d0d7de"/>
  <text x="80" y="284" font-size="12.5" fill="#1f2328"><tspan font-weight="700" fill="#8250df">strong</tspan> hits 0  →  the <tspan font-weight="700">value</tspan> is dropped   (nobody owns it any more)</text>
  <text x="80" y="308" font-size="12.5" fill="#1f2328"><tspan font-weight="700" fill="#8250df">strong</tspan> AND <tspan font-weight="700" fill="#0969da">weak</tspan> hit 0  →  the <tspan font-weight="700">allocation itself</tspan> is freed</text>

  <!-- upgrade note -->
  <text x="340" y="352" font-size="12.5" fill="#57606a" text-anchor="middle">to use a <tspan font-weight="700" fill="#0969da">Weak</tspan> you must <tspan font-family="ui-monospace,monospace" font-weight="700">.upgrade()</tspan> it → <tspan font-family="ui-monospace,monospace">Option&lt;Rc&lt;T&gt;&gt;</tspan></text>
  <text x="340" y="374" font-size="12" fill="#57606a" text-anchor="middle"><tspan font-family="ui-monospace,monospace" font-weight="700" fill="#1a7f37">Some</tspan> if the value is still alive · <tspan font-family="ui-monospace,monospace" font-weight="700" fill="#cf222e">None</tspan> if it was already dropped — so it can never dangle</text>
  <text x="340" y="404" font-size="12" font-style="italic" fill="#8a94a0" text-anchor="middle">rule of thumb: parent-owns-child uses Rc · child-points-back uses Weak · that breaks the cycle</text>
</svg>
