<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="658" height="358" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="42" font-size="20" font-weight="700" fill="#1f2328">Same line, two different fates: <tspan font-family="ui-monospace,monospace">let b = a;</tspan></text>
  <text x="32" y="66" font-size="14" fill="#57606a">it depends on whether the value owns anything on the heap</text>

  <!-- LEFT: Copy -->
  <text x="175" y="102" font-size="14" fill="#3f7a4b" font-weight="700" text-anchor="middle">Copy type — i32</text>
  <text x="175" y="122" font-size="12" fill="#57606a" text-anchor="middle">all on the stack, nothing to co-own</text>
  <rect x="60" y="140" width="100" height="48" rx="8" fill="#dbe9ff" stroke="#4a7fd6" stroke-width="2"/>
  <text x="110" y="134" font-size="12" fill="#1f2328" font-family="ui-monospace,monospace" text-anchor="middle">a</text>
  <text x="110" y="171" font-size="20" fill="#0b3d91" text-anchor="middle" font-weight="700">5</text>
  <rect x="200" y="140" width="100" height="48" rx="8" fill="#dbe9ff" stroke="#4a7fd6" stroke-width="2"/>
  <text x="250" y="134" font-size="12" fill="#1f2328" font-family="ui-monospace,monospace" text-anchor="middle">b</text>
  <text x="250" y="171" font-size="20" fill="#0b3d91" text-anchor="middle" font-weight="700">5</text>
  <text x="180" y="216" font-size="13" fill="#3f7a4b" text-anchor="middle" font-weight="700">copied — both stay usable</text>
  <text x="180" y="236" font-size="12" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace">a ✓   b ✓</text>

  <!-- divider -->
  <line x1="330" y1="96" x2="330" y2="300" stroke="#d0d7de" stroke-dasharray="4 4"/>

  <!-- RIGHT: Move -->
  <text x="490" y="102" font-size="14" fill="#a35a05" font-weight="700" text-anchor="middle">Owning type — String</text>
  <text x="490" y="122" font-size="12" fill="#57606a" text-anchor="middle">handle points to heap text</text>
  <!-- a dead -->
  <rect x="372" y="140" width="110" height="30" rx="6" fill="#eceff2" stroke="#c4cad1" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="360" y="160" font-size="12" fill="#b0b6bd" font-family="ui-monospace,monospace" text-anchor="end">a</text>
  <text x="427" y="160" font-size="11" fill="#b0b6bd" text-anchor="middle" font-family="ui-monospace,monospace">handle</text>
  <!-- b alive -->
  <rect x="372" y="182" width="110" height="30" rx="6" fill="#dbe9ff" stroke="#4a7fd6" stroke-width="2"/>
  <text x="360" y="202" font-size="12" fill="#1f2328" font-family="ui-monospace,monospace" text-anchor="end">b</text>
  <text x="427" y="202" font-size="11" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace">handle</text>
  <!-- heap -->
  <rect x="520" y="150" width="96" height="70" rx="8" fill="#fff4e6" stroke="#d98a2b" stroke-width="2"/>
  <text x="568" y="192" font-size="18" fill="#a35a05" text-anchor="middle" font-weight="700" font-family="ui-monospace,monospace">hi</text>
  <line x1="482" y1="197" x2="518" y2="188" stroke="#4a7fd6" stroke-width="2"/>
  <polygon points="518,188 508,187 511,197" fill="#4a7fd6"/>
  <text x="490" y="240" font-size="13" fill="#a35a05" text-anchor="middle" font-weight="700">moved — a is retired</text>
  <text x="490" y="260" font-size="12" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace">a ✗   b ✓</text>

  <line x1="32" y1="312" x2="628" y2="312" stroke="#e1e4e8"/>
  <text x="330" y="340" font-size="13" fill="#57606a" text-anchor="middle">Duplicating a is safe when a owns nothing (left). When a owns heap text (right), Rust moves instead of copying.</text>
</svg>
