<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="398" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="44" font-size="20" font-weight="700" fill="#1f2328">One value in memory, three labels on screen</text>
  <text x="32" y="70" font-size="14" fill="#57606a"><tspan font-family="ui-monospace, monospace" fill="#1f2328">let fahrenheit = 77.0;</tspan>  →  the bits never change; only the text does</text>

  <!-- memory box -->
  <rect x="40" y="120" width="220" height="170" rx="10" fill="#dbe9ff" stroke="#4a7fd6" stroke-width="2"/>
  <text x="150" y="150" font-size="15" fill="#57606a" text-anchor="middle" font-family="ui-monospace, monospace">fahrenheit</text>
  <line x1="66" y1="160" x2="234" y2="160" stroke="#b6cdf2"/>
  <text x="150" y="212" font-size="40" fill="#0b3d91" text-anchor="middle" font-weight="700">77.0</text>
  <text x="150" y="252" font-size="13" fill="#57606a" text-anchor="middle"><tspan font-family="ui-monospace, monospace">f32</tspan> · one fixed bit pattern</text>
  <text x="150" y="272" font-size="13" fill="#57606a" text-anchor="middle">in memory, untouched</text>

  <!-- screen / terminal panel -->
  <rect x="392" y="104" width="256" height="204" rx="10" fill="#ffffff" stroke="#8c959f" stroke-dasharray="5 4"/>
  <text x="408" y="128" font-size="13" fill="#57606a" font-family="ui-monospace, monospace">terminal output</text>

  <text x="416" y="162" font-size="15" font-family="ui-monospace, monospace" fill="#1f2328">{}</text>
  <text x="470" y="162" font-size="15" font-family="ui-monospace, monospace" fill="#8c959f">→</text>
  <text x="500" y="162" font-size="16" font-family="ui-monospace, monospace" font-weight="700" fill="#0b3d91">77</text>

  <text x="416" y="212" font-size="15" font-family="ui-monospace, monospace" fill="#1f2328">{:.1}</text>
  <text x="470" y="212" font-size="15" font-family="ui-monospace, monospace" fill="#8c959f">→</text>
  <text x="500" y="212" font-size="16" font-family="ui-monospace, monospace" font-weight="700" fill="#0b3d91">77.0</text>

  <text x="416" y="262" font-size="15" font-family="ui-monospace, monospace" fill="#1f2328">{:.2}</text>
  <text x="470" y="262" font-size="15" font-family="ui-monospace, monospace" fill="#8c959f">→</text>
  <text x="500" y="262" font-size="16" font-family="ui-monospace, monospace" font-weight="700" fill="#0b3d91">77.00</text>

  <!-- arrows from the one box to each rendering -->
  <path d="M264 190 C 330 165, 350 158, 408 158" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M264 205 C 330 205, 350 208, 408 208" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M264 220 C 330 250, 350 258, 408 258" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="32" y="344" font-size="14" fill="#1f2328">Same bits in the box the whole time — each specifier just writes a <tspan font-weight="700">different string</tspan>.</text>
  <text x="32" y="368" font-size="13" fill="#57606a"><tspan font-family="ui-monospace, monospace">{:.1}</tspan> rounds the <tspan font-style="italic">text</tspan>, not the value. Rounding the value itself is a separate step (<tspan font-family="ui-monospace, monospace">.round()</tspan>).</text>
</svg>
