<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="638" height="398" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="40" font-size="20" font-weight="700" fill="#1f2328">Each function call gets its own tray</text>
  <text x="32" y="64" font-size="14" fill="#57606a">trays are added on top and removed from the top — that pile is the <tspan font-weight="700" fill="#1f2328">call stack</tspan></text>

  <!-- double tray (on top) -->
  <rect x="60" y="84" width="380" height="96" rx="10" fill="#fff" stroke="#8c959f" stroke-dasharray="5 4"/>
  <text x="76" y="106" font-size="13" fill="#57606a" font-family="ui-monospace, monospace">double()'s tray — on top, thrown away when it returns</text>
  <rect x="76" y="116" width="110" height="52" rx="6" fill="#dbe9ff" stroke="#4a7fd6" stroke-width="2"/>
  <text x="131" y="136" font-size="13" fill="#57606a" text-anchor="middle" font-family="ui-monospace, monospace">n</text>
  <text x="131" y="160" font-size="22" fill="#0b3d91" text-anchor="middle" font-weight="700">5</text>

  <!-- main tray (bottom) -->
  <rect x="60" y="230" width="440" height="120" rx="10" fill="#fff" stroke="#8c959f" stroke-dasharray="5 4"/>
  <text x="76" y="252" font-size="13" fill="#57606a" font-family="ui-monospace, monospace">main()'s tray — the bottom of the stack</text>
  <rect x="76" y="262" width="110" height="64" rx="6" fill="#dbe9ff" stroke="#4a7fd6" stroke-width="2"/>
  <text x="131" y="284" font-size="13" fill="#57606a" text-anchor="middle" font-family="ui-monospace, monospace">x</text>
  <text x="131" y="312" font-size="24" fill="#0b3d91" text-anchor="middle" font-weight="700">5</text>
  <rect x="210" y="262" width="150" height="64" rx="6" fill="#dbe9ff" stroke="#4a7fd6" stroke-width="2"/>
  <text x="285" y="284" font-size="13" fill="#57606a" text-anchor="middle" font-family="ui-monospace, monospace">result</text>
  <text x="285" y="312" font-size="24" fill="#0b3d91" text-anchor="middle" font-weight="700">10</text>

  <!-- return arrow -->
  <path d="M 200 168 C 250 205, 260 230, 285 258" fill="none" stroke="#2da44e" stroke-width="2"/>
  <polygon points="285,262 277,251 292,252" fill="#2da44e"/>
  <text x="330" y="212" font-size="13" fill="#2da44e" font-weight="700">returns 10</text>

  <text x="60" y="380" font-size="13" fill="#57606a">When <tspan font-family="ui-monospace, monospace" fill="#1f2328">double()</tspan> finishes, its tray (and <tspan font-family="ui-monospace, monospace" fill="#1f2328">n</tspan>) is thrown away — only the returned value comes back.</text>
</svg>
