<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 670" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="698" height="668" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="40" font-size="19" font-weight="700" fill="#1f2328">Two ways a value can cross a thread boundary</text>
  <text x="32" y="63" font-size="13.5" fill="#57606a"><tspan font-family="ui-monospace,monospace" font-weight="700" fill="#bc4c00">Send</tspan> — the value itself moves across · <tspan font-family="ui-monospace,monospace" font-weight="700" fill="#0969da">Sync</tspan> — the value stays put and a <tspan font-family="ui-monospace,monospace">&amp;</tspan> crosses instead</text>

  <defs>
    <marker id="ssMove" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#bc4c00"/>
    </marker>
    <marker id="ssPoint" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0969da"/>
    </marker>
  </defs>

  <!-- ① Send -->
  <rect x="30" y="86" width="640" height="184" rx="11" fill="#fff" stroke="#d0d7de"/>
  <text x="48" y="112" font-size="13.5" font-weight="700" fill="#bc4c00">① Send — may this value <tspan font-style="italic">move</tspan> to another thread?</text>

  <line x1="350" y1="126" x2="350" y2="228" stroke="#8a94a0" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="350" y="245" font-size="10.5" fill="#8a94a0" text-anchor="middle">the thread boundary</text>

  <text x="155" y="140" font-size="11.5" font-weight="700" fill="#57606a" text-anchor="middle">thread A — stack</text>
  <rect x="60" y="150" width="190" height="66" rx="9" fill="#f6f8fa" stroke="#8a94a0" stroke-width="1.6"/>
  <rect x="80" y="166" width="150" height="32" rx="6" fill="#fff" stroke="#8a94a0" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="155" y="187" font-size="11" fill="#8a94a0" text-anchor="middle">moved out — gone</text>

  <text x="545" y="140" font-size="11.5" font-weight="700" fill="#bc4c00" text-anchor="middle">thread B — stack</text>
  <rect x="450" y="150" width="190" height="66" rx="9" fill="#fff1e7" stroke="#bc4c00" stroke-width="2"/>
  <rect x="470" y="166" width="150" height="32" rx="6" fill="#fff" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="545" y="187" font-size="11.5" font-family="ui-monospace,monospace" fill="#bc4c00" text-anchor="middle">value</text>

  <line x1="256" y1="183" x2="444" y2="183" stroke="#bc4c00" stroke-width="2.2" marker-end="url(#ssMove)"/>
  <rect x="325" y="164" width="50" height="15" fill="#fff"/>
  <text x="350" y="176" font-size="11" font-weight="700" fill="#bc4c00" text-anchor="middle" font-family="ui-monospace,monospace">Send</text>

  <text x="350" y="264" font-size="11.5" fill="#57606a" text-anchor="middle">afterwards exactly <tspan font-weight="700">one</tspan> thread has it — the ordinary ownership rule, applied across stacks</text>

  <!-- ② Sync -->
  <rect x="30" y="286" width="640" height="212" rx="11" fill="#fff" stroke="#d0d7de"/>
  <text x="48" y="312" font-size="13.5" font-weight="700" fill="#0969da">② Sync — may a <tspan font-family="ui-monospace,monospace">&amp;</tspan> to this value be <tspan font-style="italic">shared</tspan> with another thread?</text>

  <line x1="350" y1="326" x2="350" y2="398" stroke="#8a94a0" stroke-width="1.6" stroke-dasharray="6 5"/>

  <text x="155" y="340" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">thread A — stack</text>
  <rect x="60" y="350" width="190" height="52" rx="9" fill="#eaf2fb" stroke="#0969da" stroke-width="2"/>
  <rect x="80" y="362" width="150" height="28" rx="6" fill="#fff" stroke="#0969da" stroke-width="1.5"/>
  <text x="155" y="381" font-size="11.5" font-family="ui-monospace,monospace" fill="#0969da" text-anchor="middle">&amp;value</text>

  <text x="545" y="340" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">thread B — stack</text>
  <rect x="450" y="350" width="190" height="52" rx="9" fill="#eaf2fb" stroke="#0969da" stroke-width="2"/>
  <rect x="470" y="362" width="150" height="28" rx="6" fill="#fff" stroke="#0969da" stroke-width="1.5"/>
  <text x="545" y="381" font-size="11.5" font-family="ui-monospace,monospace" fill="#0969da" text-anchor="middle">&amp;value</text>

  <rect x="266" y="424" width="168" height="52" rx="9" fill="#d7f5dd" stroke="#3fa45b" stroke-width="2"/>
  <text x="350" y="445" font-size="11.5" font-family="ui-monospace,monospace" font-weight="700" fill="#1a7f37" text-anchor="middle">the value</text>
  <text x="350" y="464" font-size="10.5" fill="#1a7f37" text-anchor="middle">never moved an inch</text>

  <line x1="155" y1="404" x2="270" y2="438" stroke="#0969da" stroke-width="2.2" marker-end="url(#ssPoint)"/>
  <line x1="545" y1="404" x2="430" y2="438" stroke="#0969da" stroke-width="2.2" marker-end="url(#ssPoint)"/>

  <text x="350" y="492" font-size="11.5" fill="#57606a" text-anchor="middle"><tspan font-weight="700">two</tspan> threads reach the same bytes at the same instant — so <tspan font-family="ui-monospace,monospace">T: Sync</tspan> ⟺ <tspan font-family="ui-monospace,monospace">&amp;T: Send</tspan></text>

  <!-- ③ auto traits -->
  <rect x="30" y="514" width="640" height="136" rx="11" fill="#fff" stroke="#d0d7de"/>
  <text x="48" y="540" font-size="13.5" font-weight="700" fill="#1f2328">③ You never write these — one bad field is enough to lose them</text>

  <text x="474" y="562" font-size="11" font-weight="700" fill="#57606a" text-anchor="middle">Send</text>
  <text x="574" y="562" font-size="11" font-weight="700" fill="#57606a" text-anchor="middle">Sync</text>

  <text x="62" y="584" font-size="11.5" font-family="ui-monospace,monospace" fill="#57606a">title: String</text>
  <text x="474" y="584" font-size="13" font-weight="700" fill="#1a7f37" text-anchor="middle">✓</text>
  <text x="574" y="584" font-size="13" font-weight="700" fill="#1a7f37" text-anchor="middle">✓</text>

  <text x="62" y="606" font-size="11.5" font-family="ui-monospace,monospace" fill="#cf222e">lines: Rc&lt;Vec&lt;String&gt;&gt;</text>
  <text x="474" y="606" font-size="13" font-weight="700" fill="#cf222e" text-anchor="middle">✗</text>
  <text x="574" y="606" font-size="13" font-weight="700" fill="#cf222e" text-anchor="middle">✗</text>

  <line x1="58" y1="616" x2="620" y2="616" stroke="#d0d7de" stroke-width="1.4"/>

  <text x="62" y="636" font-size="11.5" font-family="ui-monospace,monospace" font-weight="700" fill="#1f2328">struct Report</text>
  <text x="474" y="636" font-size="13" font-weight="700" fill="#cf222e" text-anchor="middle">✗</text>
  <text x="574" y="636" font-size="13" font-weight="700" fill="#cf222e" text-anchor="middle">✗</text>
  <text x="205" y="636" font-size="10.5" font-style="italic" fill="#8a94a0">…so the whole struct is refused</text>
</svg>
