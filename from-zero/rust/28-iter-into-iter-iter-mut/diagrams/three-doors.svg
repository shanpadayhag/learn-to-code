<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="718" height="378" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="38" font-size="19" font-weight="700" fill="#1f2328">Three doors out of one Vec</text>
  <text x="32" y="61" font-size="13.5" fill="#57606a">Same collection — the door you pick decides ownership, and what's left behind</text>

  <!-- the Vec -->
  <rect x="300" y="80" width="120" height="40" rx="8" fill="#eee7fb" stroke="#8250df" stroke-width="1.5"/>
  <text x="360" y="105" font-size="13" fill="#6639ba" text-anchor="middle" font-family="ui-monospace,monospace">vec![...]</text>

  <line x1="330" y1="120" x2="150" y2="150" stroke="#8c959f" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="360" y1="120" x2="360" y2="150" stroke="#8c959f" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="390" y1="120" x2="570" y2="150" stroke="#8c959f" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- door 1: iter -->
  <rect x="28" y="156" width="208" height="176" rx="10" fill="#fff" stroke="#3fa45b" stroke-width="1.5"/>
  <text x="132" y="182" font-size="13.5" font-weight="700" fill="#1a7f37" text-anchor="middle" font-family="ui-monospace,monospace">.iter()</text>
  <rect x="60" y="196" width="144" height="34" rx="6" fill="#d7f5dd" stroke="#3fa45b" stroke-width="2"/>
  <text x="132" y="218" font-size="13" fill="#1a7f37" text-anchor="middle" font-family="ui-monospace,monospace">each item: &amp;T</text>
  <text x="132" y="252" font-size="12" fill="#1f2328" text-anchor="middle">BORROW — look, don't touch</text>
  <text x="132" y="286" font-size="12" fill="#57606a" text-anchor="middle">nothing moves</text>
  <text x="132" y="312" font-size="12.5" fill="#1a7f37" text-anchor="middle" font-weight="700">Vec survives ✓</text>

  <!-- door 2: iter_mut -->
  <rect x="252" y="156" width="208" height="176" rx="10" fill="#fff" stroke="#d98f3f" stroke-width="1.5"/>
  <text x="356" y="182" font-size="13.5" font-weight="700" fill="#9a5a00" text-anchor="middle" font-family="ui-monospace,monospace">.iter_mut()</text>
  <rect x="284" y="196" width="144" height="34" rx="6" fill="#ffe9d6" stroke="#d98f3f" stroke-width="2"/>
  <text x="356" y="218" font-size="13" fill="#9a5a00" text-anchor="middle" font-family="ui-monospace,monospace">each item: &amp;mut T</text>
  <text x="356" y="252" font-size="12" fill="#1f2328" text-anchor="middle">MUTABLE BORROW — edit</text>
  <text x="356" y="286" font-size="12" fill="#57606a" text-anchor="middle">write through *n, in place</text>
  <text x="356" y="312" font-size="12.5" fill="#9a5a00" text-anchor="middle" font-weight="700">Vec survives, changed ✓</text>

  <!-- door 3: into_iter -->
  <rect x="476" y="156" width="216" height="176" rx="10" fill="#fff" stroke="#cf222e" stroke-width="1.5"/>
  <text x="584" y="182" font-size="13.5" font-weight="700" fill="#a40e26" text-anchor="middle" font-family="ui-monospace,monospace">.into_iter()</text>
  <rect x="512" y="196" width="144" height="34" rx="6" fill="#ffe3e6" stroke="#cf222e" stroke-width="2"/>
  <text x="584" y="218" font-size="13" fill="#a40e26" text-anchor="middle" font-family="ui-monospace,monospace">each item: T</text>
  <text x="584" y="252" font-size="12" fill="#1f2328" text-anchor="middle">CONSUME — take the values</text>
  <text x="584" y="286" font-size="12" fill="#57606a" text-anchor="middle">values moved out, no clone</text>
  <text x="584" y="312" font-size="12.5" fill="#a40e26" text-anchor="middle" font-weight="700">Vec gone ✗</text>

  <text x="32" y="362" font-size="12.5" fill="#57606a">Rule of thumb: <tspan font-weight="700" fill="#1f2328">need it later → .iter()</tspan> · <tspan font-weight="700" fill="#1f2328">change it → .iter_mut()</tspan> · <tspan font-weight="700" fill="#1f2328">turn it into something new → .into_iter()</tspan>.</text>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8c959f"/></marker>
  </defs>
</svg>
