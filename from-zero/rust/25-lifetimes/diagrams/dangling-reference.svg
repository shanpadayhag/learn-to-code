<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="678" height="398" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="38" font-size="19" font-weight="700" fill="#1f2328">A dangling reference — what lifetimes exist to stop</text>
  <text x="32" y="61" font-size="13.5" fill="#57606a">a reference is an address; it is only valid while the value it points at is still alive</text>

  <!-- STEP 1: inner scope alive -->
  <text x="40" y="96" font-size="13" font-weight="700" fill="#1a7f37">1. inside the inner block</text>
  <rect x="30" y="108" width="290" height="150" rx="10" fill="#fff" stroke="#d0d7de"/>
  <!-- outer slot r -->
  <rect x="50" y="128" width="120" height="44" rx="6" fill="#fff" stroke="#a9b2bd" stroke-width="1.5"/>
  <text x="110" y="122" font-size="11" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace">r (outer)</text>
  <text x="110" y="156" font-size="13" fill="#57606a" text-anchor="middle">&amp; ────┐</text>
  <!-- inner slot x -->
  <rect x="180" y="196" width="120" height="44" rx="6" fill="#d7f5dd" stroke="#3fa45b" stroke-width="2"/>
  <text x="240" y="190" font-size="11" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace">x (inner)</text>
  <text x="240" y="224" font-size="15" fill="#1a7f37" text-anchor="middle" font-weight="700">5</text>
  <path d="M 150 150 C 200 150 240 165 240 194" fill="none" stroke="#3fa45b" stroke-width="2" marker-end="url(#g)"/>
  <text x="150" y="252" font-size="11.5" fill="#1a7f37">r points at a live value — fine</text>

  <!-- STEP 2: inner scope ended -->
  <text x="366" y="96" font-size="13" font-weight="700" fill="#b02a37">2. after the inner block ends</text>
  <rect x="360" y="108" width="290" height="150" rx="10" fill="#fff" stroke="#d0d7de"/>
  <rect x="380" y="128" width="120" height="44" rx="6" fill="#fff" stroke="#a9b2bd" stroke-width="1.5"/>
  <text x="440" y="122" font-size="11" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace">r (outer)</text>
  <text x="440" y="156" font-size="13" fill="#57606a" text-anchor="middle">&amp; ────┐</text>
  <!-- reclaimed slot -->
  <rect x="510" y="196" width="120" height="44" rx="6" fill="#ffe3e3" stroke="#d1666b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="570" y="190" font-size="11" fill="#b02a37" text-anchor="middle" font-family="ui-monospace,monospace">x — gone</text>
  <text x="570" y="223" font-size="12" fill="#b02a37" text-anchor="middle">reclaimed</text>
  <path d="M 480 150 C 530 150 570 165 570 194" fill="none" stroke="#b02a37" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#r)"/>
  <text x="386" y="252" font-size="11.5" fill="#b02a37">r now points at dead memory 💥</text>

  <line x1="32" y1="286" x2="648" y2="286" stroke="#e1e4e8"/>
  <text x="32" y="312" font-size="12.5" fill="#57606a">In C this compiles and reads garbage (a use-after-free bug). In Rust it <tspan font-weight="700" fill="#1f2328">does not compile</tspan>:</text>
  <text x="32" y="336" font-size="12.5" font-family="ui-monospace,monospace" fill="#b02a37">error[E0597]: `x` does not live long enough</text>
  <text x="32" y="362" font-size="12.5" fill="#57606a">The <tspan font-weight="700" fill="#1f2328">borrow checker</tspan> saw that <tspan font-family="ui-monospace,monospace">r</tspan>'s lifetime outlasts <tspan font-family="ui-monospace,monospace">x</tspan>'s, and rejected it. Lifetimes are that check's bookkeeping.</text>

  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3fa45b"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#b02a37"/></marker>
  </defs>
</svg>
