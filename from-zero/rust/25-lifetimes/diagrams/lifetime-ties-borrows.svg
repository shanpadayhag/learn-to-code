<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="678" height="378" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="38" font-size="19" font-weight="700" fill="#1f2328"><tspan font-family="ui-monospace,monospace">'a</tspan> is a name that ties borrows together</text>
  <text x="32" y="61" font-size="13.5" fill="#57606a">it doesn't make anything live longer — it says "the output borrows from these inputs"</text>

  <!-- the signature -->
  <rect x="60" y="86" width="560" height="44" rx="8" fill="#fff" stroke="#4a7fd6" stroke-width="2"/>
  <text x="340" y="114" font-size="15" font-family="ui-monospace,monospace" text-anchor="middle" fill="#1f2328">fn longest<tspan fill="#8250df" font-weight="700">&lt;'a&gt;</tspan>(x: &amp;<tspan fill="#8250df" font-weight="700">'a</tspan> str, y: &amp;<tspan fill="#8250df" font-weight="700">'a</tspan> str) -&gt; &amp;<tspan fill="#8250df" font-weight="700">'a</tspan> str</text>

  <!-- three tags -->
  <text x="150" y="170" font-size="13" font-family="ui-monospace,monospace" fill="#1f2328" text-anchor="middle">x: &amp;'a str</text>
  <text x="340" y="170" font-size="13" font-family="ui-monospace,monospace" fill="#1f2328" text-anchor="middle">y: &amp;'a str</text>
  <text x="540" y="170" font-size="13" font-family="ui-monospace,monospace" fill="#1f2328" text-anchor="middle">returns &amp;'a str</text>

  <!-- band connecting them -->
  <rect x="90" y="188" width="500" height="40" rx="20" fill="#efe8ff" stroke="#8250df" stroke-width="1.5"/>
  <text x="340" y="213" font-size="13" fill="#8250df" text-anchor="middle" font-weight="700">one shared lifetime 'a — the span where ALL of them are valid</text>
  <line x1="150" y1="176" x2="150" y2="188" stroke="#8250df" stroke-width="1.5"/>
  <line x1="340" y1="176" x2="340" y2="188" stroke="#8250df" stroke-width="1.5"/>
  <line x1="540" y1="176" x2="540" y2="188" stroke="#8250df" stroke-width="1.5"/>

  <text x="340" y="262" font-size="13" fill="#57606a" text-anchor="middle">so the compiler knows: the returned <tspan font-family="ui-monospace,monospace">&amp;str</tspan> is valid only as long as <tspan font-weight="700" fill="#1f2328">both</tspan> x and y are</text>

  <line x1="32" y1="292" x2="648" y2="292" stroke="#e1e4e8"/>
  <text x="32" y="317" font-size="12.5" fill="#57606a">Without the name, the compiler can't tell if the result borrows from x or y:</text>
  <text x="32" y="341" font-size="12.5" font-family="ui-monospace,monospace" fill="#b02a37">error[E0106]: missing lifetime specifier — is it borrowed from `x` or `y`?</text>
  <text x="32" y="365" font-size="12.5" fill="#57606a">The <tspan font-family="ui-monospace,monospace" fill="#8250df">'a</tspan> answers that question. It vanishes at compile time — <tspan font-weight="700" fill="#1f2328">zero runtime cost</tspan>.</text>
</svg>
