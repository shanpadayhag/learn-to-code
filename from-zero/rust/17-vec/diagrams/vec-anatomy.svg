<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="638" height="398" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="40" font-size="20" font-weight="700" fill="#1f2328">A Vec is three little numbers on the stack…</text>
  <text x="32" y="64" font-size="14" fill="#57606a">let v: Vec&lt;i32&gt; = vec![10, 20, 30];  <tspan fill="#8a94a0">// pushed 3, room for 4</tspan></text>

  <!-- stack: the Vec header -->
  <text x="60" y="108" font-size="12" fill="#57606a" text-anchor="middle">STACK</text>
  <rect x="40" y="120" width="200" height="120" rx="10" fill="#e7e0ff" stroke="#8a63d2" stroke-width="2"/>
  <text x="140" y="112" font-size="13" fill="#57606a" text-anchor="middle">v (the Vec header, 24 bytes)</text>

  <rect x="56" y="134" width="168" height="30" rx="6" fill="#fff" stroke="#8a63d2"/>
  <text x="66" y="154" font-size="13" font-family="ui-monospace,monospace" fill="#5a3ea8">ptr  →</text>
  <rect x="56" y="170" width="168" height="30" rx="6" fill="#fff" stroke="#8a63d2"/>
  <text x="66" y="190" font-size="13" font-family="ui-monospace,monospace" fill="#5a3ea8">len  = 3</text>
  <rect x="56" y="206" width="168" height="30" rx="6" fill="#fff" stroke="#8a63d2"/>
  <text x="66" y="226" font-size="13" font-family="ui-monospace,monospace" fill="#5a3ea8">cap  = 4</text>

  <!-- heap: the buffer -->
  <text x="470" y="108" font-size="12" fill="#57606a" text-anchor="middle">HEAP</text>
  <rect x="340" y="120" width="260" height="70" rx="10" fill="#ffe9c9" stroke="#d98a3d" stroke-width="2"/>
  <g font-family="ui-monospace,monospace" font-size="15" text-anchor="middle">
    <rect x="352" y="134" width="56" height="42" rx="5" fill="#dbe9ff" stroke="#4a7fd6"/><text x="380" y="161" fill="#0b3d91">10</text>
    <rect x="412" y="134" width="56" height="42" rx="5" fill="#dbe9ff" stroke="#4a7fd6"/><text x="440" y="161" fill="#0b3d91">20</text>
    <rect x="472" y="134" width="56" height="42" rx="5" fill="#dbe9ff" stroke="#4a7fd6"/><text x="500" y="161" fill="#0b3d91">30</text>
    <rect x="532" y="134" width="56" height="42" rx="5" fill="#eef1f5" stroke="#a9b2bd" stroke-dasharray="4 3"/><text x="560" y="161" fill="#a9b2bd" font-size="11">spare</text>
  </g>
  <text x="380" y="228" font-size="11" fill="#57606a" text-anchor="middle">[0]</text>
  <text x="440" y="228" font-size="11" fill="#57606a" text-anchor="middle">[1]</text>
  <text x="500" y="228" font-size="11" fill="#57606a" text-anchor="middle">[2]</text>
  <text x="560" y="228" font-size="11" fill="#8a94a0" text-anchor="middle">unused</text>

  <!-- pointer arrow -->
  <line x1="224" y1="149" x2="352" y2="149" stroke="#8a63d2" stroke-width="2" marker-end="url(#a)"/>

  <line x1="32" y1="270" x2="608" y2="270" stroke="#e1e4e8"/>
  <text x="32" y="298" font-size="13" fill="#57606a"><tspan font-weight="700" fill="#1f2328">ptr</tspan> points at the elements, laid out back-to-back on the heap. <tspan font-weight="700" fill="#1f2328">len</tspan> is how many you've</text>
  <text x="32" y="318" font-size="13" fill="#57606a">stored; <tspan font-weight="700" fill="#1f2328">cap</tspan> is how many fit before the buffer must grow. Always <tspan font-family="ui-monospace,monospace" fill="#1f2328">len ≤ cap</tspan>.</text>
  <text x="32" y="346" font-size="13" fill="#57606a">The header is a fixed 24 bytes no matter how long the list gets — the data lives on the heap.</text>
  <text x="32" y="374" font-size="13" fill="#8a94a0">(This is exactly what a String is inside: a Vec of bytes. Same ptr/len/cap trio.)</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#8a63d2"/></marker>
  </defs>
</svg>
