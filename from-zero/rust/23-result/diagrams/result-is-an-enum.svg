<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="638" height="378" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="42" font-size="20" font-weight="700" fill="#1f2328">enum Result&lt;T, E&gt; { Ok(T), Err(E) }</text>
  <text x="32" y="66" font-size="14" fill="#57606a">an ordinary <tspan font-weight="700" fill="#1f2328">enum</tspan> with two variants: it worked (<tspan font-weight="700" fill="#1a7f37">Ok</tspan>) or it failed (<tspan font-weight="700" fill="#b02a37">Err</tspan>)</text>

  <!-- Ok row -->
  <text x="32" y="132" font-size="14" font-family="ui-monospace,monospace" fill="#1f2328">Ok(5)</text>
  <rect x="190" y="108" width="80" height="52" rx="8" fill="#d7f5dd" stroke="#3fa45b" stroke-width="2"/>
  <text x="230" y="102" font-size="11" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace">tag</text>
  <text x="230" y="140" font-size="17" fill="#1a7f37" text-anchor="middle" font-weight="700">Ok</text>
  <rect x="278" y="108" width="130" height="52" rx="6" fill="#dbe9ff" stroke="#4a7fd6" stroke-width="2"/>
  <text x="343" y="139" font-size="18" fill="#0b3d91" text-anchor="middle" font-weight="700">5</text>
  <text x="426" y="140" font-size="13" fill="#57606a">← the value you wanted</text>

  <!-- Err row -->
  <text x="32" y="222" font-size="14" font-family="ui-monospace,monospace" fill="#1f2328">Err("too small")</text>
  <rect x="190" y="198" width="80" height="52" rx="8" fill="#ffe3e3" stroke="#d1666b" stroke-width="2"/>
  <text x="230" y="192" font-size="11" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace">tag</text>
  <text x="230" y="230" font-size="17" fill="#b02a37" text-anchor="middle" font-weight="700">Err</text>
  <rect x="278" y="198" width="130" height="52" rx="6" fill="#ffe9d6" stroke="#d98f3f" stroke-width="2"/>
  <text x="343" y="229" font-size="13" fill="#9a5a00" text-anchor="middle" font-weight="700">"too small"</text>
  <text x="426" y="230" font-size="13" fill="#57606a">← the reason it failed</text>

  <line x1="32" y1="288" x2="608" y2="288" stroke="#e1e4e8"/>
  <text x="32" y="318" font-size="13" fill="#57606a">Where <tspan font-weight="700" fill="#1f2328">Option</tspan>'s <tspan font-weight="700" fill="#b02a37">None</tspan> was <tspan font-style="italic">empty</tspan>, <tspan font-weight="700" fill="#1f2328">Result</tspan>'s <tspan font-weight="700" fill="#b02a37">Err</tspan> <tspan font-weight="700" fill="#1f2328">carries the story</tspan> of what went wrong —</text>
  <text x="32" y="338" font-size="13" fill="#57606a">and the compiler <tspan font-weight="700" fill="#1f2328">forces you to handle the Err</tspan> before you can touch the value.</text>
</svg>
