<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="428" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="40" font-size="20" font-weight="700" fill="#1f2328">One Vec, many types — because every slot is a Box</text>
  <text x="32" y="64" font-size="13" fill="#57606a">Vec&lt;Box&lt;dyn Greet&gt;&gt;: the slots are equal-sized pointers, so a Dog and a Cat fit side by side.</text>

  <!-- Vec on the stack: equal-sized slots -->
  <text x="150" y="104" font-size="12" fill="#57606a" text-anchor="middle">THE Vec — uniform slots (a box is just a pointer)</text>
  <rect x="40" y="118" width="80" height="58" rx="8" fill="#dbe9ff" stroke="#4a7fd6" stroke-width="2"/>
  <text x="80" y="142" font-size="11.5" fill="#0b3d91" text-anchor="middle">Box →</text>
  <text x="80" y="160" font-size="10.5" fill="#0b3d91" text-anchor="middle">[0]</text>
  <rect x="130" y="118" width="80" height="58" rx="8" fill="#dbe9ff" stroke="#4a7fd6" stroke-width="2"/>
  <text x="170" y="142" font-size="11.5" fill="#0b3d91" text-anchor="middle">Box →</text>
  <text x="170" y="160" font-size="10.5" fill="#0b3d91" text-anchor="middle">[1]</text>
  <rect x="220" y="118" width="80" height="58" rx="8" fill="#dbe9ff" stroke="#4a7fd6" stroke-width="2"/>
  <text x="260" y="142" font-size="11.5" fill="#0b3d91" text-anchor="middle">Box →</text>
  <text x="260" y="160" font-size="10.5" fill="#0b3d91" text-anchor="middle">[2]</text>

  <!-- heap values: different shapes/sizes -->
  <text x="520" y="104" font-size="12" fill="#57606a" text-anchor="middle">THE HEAP — different types, different sizes</text>
  <rect x="430" y="112" width="150" height="46" rx="8" fill="#ffe9c9" stroke="#d98a3d" stroke-width="2"/>
  <text x="505" y="140" font-size="12.5" fill="#8a5a1d" text-anchor="middle">Dog  ·  hello()=Woof!</text>

  <rect x="430" y="196" width="210" height="46" rx="8" fill="#d9f2e6" stroke="#3aa06a" stroke-width="2"/>
  <text x="535" y="224" font-size="12.5" fill="#1d6b45" text-anchor="middle">Cat (bigger struct)  ·  hello()=Meow!</text>

  <rect x="430" y="280" width="150" height="46" rx="8" fill="#ffe9c9" stroke="#d98a3d" stroke-width="2"/>
  <text x="505" y="308" font-size="12.5" fill="#8a5a1d" text-anchor="middle">Dog  ·  hello()=Woof!</text>

  <!-- arrows from slots to heap -->
  <line x1="120" y1="147" x2="428" y2="135" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="210" y1="147" x2="428" y2="219" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="300" y1="147" x2="428" y2="303" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>

  <text x="32" y="372" font-size="13" fill="#1f2328" font-weight="600">The slots are all the same size (one pointer each) — that is what lets different-sized values share one Vec.</text>
  <text x="32" y="398" font-size="12.5" fill="#57606a">Each element promises only "I am some Greet." The real type — and which hello() runs — is settled at run time.</text>
</svg>
