<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="698" height="698" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="40" font-size="19" font-weight="700" fill="#1f2328">The executor is a loop. Concurrency is one loop holding two futures.</text>
  <text x="32" y="63" font-size="13.5" fill="#57606a">A future answers one question, over and over: <tspan font-family="ui-monospace,monospace" font-weight="700" fill="#1a7f37">Ready(T)</tspan> or <tspan font-family="ui-monospace,monospace" font-weight="700" fill="#bc4c00">Pending</tspan>.</text>

  <defs>
    <marker id="plArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#57606a"/>
    </marker>
    <marker id="plBack" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#bc4c00"/>
    </marker>
  </defs>

  <!-- (1) the trait -->
  <rect x="30" y="86" width="640" height="130" rx="11" fill="#fff" stroke="#d0d7de"/>
  <text x="48" y="112" font-size="13.5" font-weight="700" fill="#8250df">① one method, two answers</text>

  <rect x="55" y="126" width="230" height="66" rx="9" fill="#f5f0ff" stroke="#8250df" stroke-width="2"/>
  <text x="170" y="150" font-size="11" font-family="ui-monospace,monospace" font-weight="700" fill="#8250df" text-anchor="middle">the paused function</text>
  <text x="170" y="168" font-size="10" font-family="ui-monospace,monospace" fill="#57606a" text-anchor="middle">state tag + saved locals</text>
  <text x="170" y="183" font-size="10" font-family="ui-monospace,monospace" fill="#57606a" text-anchor="middle">(concept 38)</text>

  <line x1="292" y1="159" x2="382" y2="159" stroke="#57606a" stroke-width="2" marker-end="url(#plArrow)"/>
  <rect x="300" y="140" width="76" height="16" fill="#fff"/>
  <text x="338" y="152" font-size="10.5" font-weight="700" font-family="ui-monospace,monospace" fill="#57606a" text-anchor="middle">.poll()</text>

  <rect x="392" y="126" width="128" height="28" rx="7" fill="#eafaef" stroke="#1a7f37" stroke-width="1.8"/>
  <text x="456" y="145" font-size="11" font-family="ui-monospace,monospace" font-weight="700" fill="#1a7f37" text-anchor="middle">Poll::Ready(T)</text>
  <text x="536" y="145" font-size="10.5" fill="#57606a">done — here it is</text>

  <rect x="392" y="164" width="128" height="28" rx="7" fill="#fff1e7" stroke="#bc4c00" stroke-width="1.8"/>
  <text x="456" y="183" font-size="11" font-family="ui-monospace,monospace" font-weight="700" fill="#bc4c00" text-anchor="middle">Poll::Pending</text>
  <text x="536" y="183" font-size="10.5" fill="#57606a">not yet — ask again</text>

  <!-- (2) block_on -->
  <rect x="30" y="232" width="640" height="176" rx="11" fill="#fff" stroke="#d0d7de"/>
  <text x="48" y="258" font-size="13.5" font-weight="700" fill="#0969da">② <tspan font-family="ui-monospace,monospace">block_on</tspan> — one future, driven until it answers Ready</text>

  <rect x="60" y="272" width="120" height="46" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.8"/>
  <text x="120" y="292" font-size="10.5" font-family="ui-monospace,monospace" fill="#0969da" text-anchor="middle">poll #1</text>
  <text x="120" y="308" font-size="10" font-family="ui-monospace,monospace" fill="#bc4c00" text-anchor="middle">Pending</text>

  <rect x="220" y="272" width="120" height="46" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.8"/>
  <text x="280" y="292" font-size="10.5" font-family="ui-monospace,monospace" fill="#0969da" text-anchor="middle">poll #2</text>
  <text x="280" y="308" font-size="10" font-family="ui-monospace,monospace" fill="#bc4c00" text-anchor="middle">Pending</text>

  <rect x="380" y="272" width="120" height="46" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.8"/>
  <text x="440" y="292" font-size="10.5" font-family="ui-monospace,monospace" fill="#0969da" text-anchor="middle">poll #3</text>
  <text x="440" y="308" font-size="10" font-family="ui-monospace,monospace" fill="#bc4c00" text-anchor="middle">Pending</text>

  <rect x="540" y="272" width="120" height="46" rx="8" fill="#eafaef" stroke="#1a7f37" stroke-width="2"/>
  <text x="600" y="292" font-size="10.5" font-family="ui-monospace,monospace" fill="#1a7f37" text-anchor="middle">poll #4</text>
  <text x="600" y="308" font-size="10" font-family="ui-monospace,monospace" font-weight="700" fill="#1a7f37" text-anchor="middle">Ready(3)</text>

  <line x1="186" y1="295" x2="214" y2="295" stroke="#57606a" stroke-width="1.8" marker-end="url(#plArrow)"/>
  <line x1="346" y1="295" x2="374" y2="295" stroke="#57606a" stroke-width="1.8" marker-end="url(#plArrow)"/>
  <line x1="506" y1="295" x2="534" y2="295" stroke="#57606a" stroke-width="1.8" marker-end="url(#plArrow)"/>

  <path d="M440,326 L440,346 L120,346 L120,328" fill="none" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#plBack)"/>
  <rect x="212" y="338" width="156" height="16" fill="#fff"/>
  <text x="290" y="350" font-size="10.5" font-weight="700" fill="#bc4c00" text-anchor="middle">Pending → poll again</text>

  <rect x="60" y="362" width="600" height="34" rx="7" fill="#fff8c5" stroke="#9a6700" stroke-width="1.4"/>
  <text x="360" y="384" font-size="11" fill="#9a6700" text-anchor="middle">with a no-op waker this loop <tspan font-weight="700">spins</tspan> — a real executor sleeps until the waker says "poll me now"</text>

  <!-- (3) run_both -->
  <rect x="30" y="424" width="640" height="250" rx="11" fill="#fff" stroke="#d0d7de"/>
  <text x="48" y="450" font-size="13.5" font-weight="700" fill="#1a7f37">③ <tspan font-family="ui-monospace,monospace">run_both</tspan> — same loop, two futures, one thread</text>

  <rect x="50" y="464" width="112" height="150" rx="9" fill="#f6f8fa" stroke="#8a94a0" stroke-width="1.6"/>
  <text x="106" y="484" font-size="10.5" font-weight="700" fill="#57606a" text-anchor="middle">the one thread</text>
  <rect x="64" y="494" width="84" height="46" rx="7" fill="#f5f0ff" stroke="#8250df" stroke-width="1.6"/>
  <text x="106" y="514" font-size="10" font-family="ui-monospace,monospace" fill="#8250df" text-anchor="middle">toast</text>
  <text x="106" y="528" font-size="9.5" font-family="ui-monospace,monospace" fill="#57606a" text-anchor="middle">future</text>
  <rect x="64" y="548" width="84" height="46" rx="7" fill="#f5f0ff" stroke="#8250df" stroke-width="1.6"/>
  <text x="106" y="568" font-size="10" font-family="ui-monospace,monospace" fill="#8250df" text-anchor="middle">eggs</text>
  <text x="106" y="582" font-size="9.5" font-family="ui-monospace,monospace" fill="#57606a" text-anchor="middle">future</text>

  <text x="448" y="484" font-size="11" font-weight="700" fill="#57606a" text-anchor="middle">one loop, alternating polls</text>

  <line x1="248" y1="512" x2="648" y2="512" stroke="#d0d7de" stroke-width="1.4"/>
  <line x1="248" y1="570" x2="648" y2="570" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="240" y="516" font-size="10" font-family="ui-monospace,monospace" fill="#8250df" text-anchor="end">toast</text>
  <text x="240" y="574" font-size="10" font-family="ui-monospace,monospace" fill="#8250df" text-anchor="end">eggs</text>

  <rect x="262" y="500" width="70" height="24" rx="6" fill="#f5f0ff" stroke="#8250df" stroke-width="1.5"/>
  <text x="297" y="516" font-size="9.5" font-family="ui-monospace,monospace" fill="#8250df" text-anchor="middle">step 1</text>
  <rect x="352" y="558" width="70" height="24" rx="6" fill="#f5f0ff" stroke="#8250df" stroke-width="1.5"/>
  <text x="387" y="574" font-size="9.5" font-family="ui-monospace,monospace" fill="#8250df" text-anchor="middle">step 1</text>
  <rect x="442" y="500" width="70" height="24" rx="6" fill="#f5f0ff" stroke="#8250df" stroke-width="1.5"/>
  <text x="477" y="516" font-size="9.5" font-family="ui-monospace,monospace" fill="#8250df" text-anchor="middle">step 2</text>
  <rect x="532" y="558" width="70" height="24" rx="6" fill="#f5f0ff" stroke="#8250df" stroke-width="1.5"/>
  <text x="567" y="574" font-size="9.5" font-family="ui-monospace,monospace" fill="#8250df" text-anchor="middle">step 2</text>
  <rect x="578" y="500" width="70" height="24" rx="6" fill="#eafaef" stroke="#1a7f37" stroke-width="1.6"/>
  <text x="613" y="516" font-size="9.5" font-family="ui-monospace,monospace" fill="#1a7f37" text-anchor="middle">step 3</text>

  <text x="448" y="606" font-size="10.5" fill="#8a94a0" text-anchor="middle">time →</text>

  <rect x="55" y="626" width="605" height="34" rx="7" fill="#eafaef" stroke="#1a7f37" stroke-width="1.4"/>
  <text x="357" y="648" font-size="11.5" fill="#1a7f37" text-anchor="middle"><tspan font-family="ui-monospace,monospace" font-weight="700">.await</tspan> in one task is sequential · polling two futures in one loop is <tspan font-weight="700">concurrency</tspan> — no thread spawned</text>

  <text x="350" y="688" font-size="11" fill="#8a94a0" text-anchor="middle">this is the whole difference between "async" and "concurrent": who is holding the loop</text>
</svg>
