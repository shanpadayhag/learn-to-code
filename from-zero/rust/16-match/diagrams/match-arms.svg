<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="638" height="418" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="40" font-size="20" font-weight="700" fill="#1f2328">match: check the value against each arm, top to bottom</text>

  <!-- the value -->
  <text x="32" y="86" font-size="14" font-family="ui-monospace,monospace" fill="#1f2328">coin =</text>
  <rect x="110" y="66" width="70" height="40" rx="8" fill="#d7f5dd" stroke="#3fa45b" stroke-width="2"/>
  <text x="145" y="60" font-size="10" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace">tag</text>
  <text x="145" y="92" font-size="14" fill="#1a7f37" text-anchor="middle" font-weight="700">Dime</text>

  <!-- arms -->
  <g font-family="ui-monospace,monospace" font-size="14">
    <rect x="110" y="130" width="230" height="34" rx="6" fill="#fff" stroke="#d0d7de"/>
    <text x="124" y="152" fill="#8a94a0">Coin::Penny   => 1</text>
    <text x="360" y="152" font-size="12" fill="#c0c6cd" font-family="ui-sans-serif">tag ≠ Penny · skip</text>

    <rect x="110" y="170" width="230" height="34" rx="6" fill="#fff" stroke="#d0d7de"/>
    <text x="124" y="192" fill="#8a94a0">Coin::Nickel  => 5</text>
    <text x="360" y="192" font-size="12" fill="#c0c6cd" font-family="ui-sans-serif">tag ≠ Nickel · skip</text>

    <rect x="110" y="210" width="230" height="34" rx="6" fill="#dbe9ff" stroke="#4a7fd6" stroke-width="2"/>
    <text x="124" y="232" fill="#0b3d91" font-weight="700">Coin::Dime    => 10</text>
    <text x="360" y="232" font-size="12" fill="#0b3d91" font-family="ui-sans-serif" font-weight="700">✓ match! run this arm →</text>

    <rect x="110" y="250" width="230" height="34" rx="6" fill="#fff" stroke="#d0d7de"/>
    <text x="124" y="272" fill="#8a94a0">Coin::Quarter(s) => 25</text>
    <text x="360" y="272" font-size="12" fill="#c0c6cd" font-family="ui-sans-serif">never reached this time</text>
  </g>

  <!-- result -->
  <text x="110" y="316" font-size="14" font-family="ui-monospace,monospace" fill="#1f2328">result =</text>
  <rect x="200" y="298" width="60" height="34" rx="6" fill="#fff5d6" stroke="#d4a72c" stroke-width="2"/>
  <text x="230" y="320" font-size="15" fill="#7a5c00" text-anchor="middle" font-weight="700" font-family="ui-monospace,monospace">10</text>
  <text x="272" y="320" font-size="13" fill="#57606a">← match is an expression: the winning arm's value comes out</text>

  <line x1="32" y1="352" x2="608" y2="352" stroke="#e1e4e8"/>
  <text x="32" y="382" font-size="13" fill="#57606a">The compiler checks the arms cover <tspan font-weight="700" fill="#1f2328">every</tspan> variant. Miss one and it won't compile —</text>
  <text x="32" y="402" font-size="13" fill="#57606a">so a case can never be silently forgotten. That guarantee is the whole point of match.</text>
</svg>
