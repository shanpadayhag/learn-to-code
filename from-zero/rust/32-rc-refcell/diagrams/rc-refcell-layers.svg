<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="678" height="408" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="40" font-size="19" font-weight="700" fill="#1f2328"><tspan font-family="ui-monospace,monospace">Rc&lt;RefCell&lt;T&gt;&gt;</tspan> — many owners, one value they can all change</text>
  <text x="32" y="63" font-size="13.5" fill="#57606a">the <tspan font-weight="700" fill="#8250df">Rc</tspan> shares the ownership · the <tspan font-weight="700" fill="#d4a72c">RefCell</tspan> inside supplies the mutation</text>

  <defs>
    <marker id="p32" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8250df"/>
    </marker>
  </defs>

  <!-- three owners on the stack -->
  <text x="120" y="108" font-size="12.5" font-weight="700" fill="#57606a" text-anchor="middle">owners (stack)</text>
  <g font-family="ui-monospace,monospace">
    <rect x="60" y="120" width="120" height="34" rx="7" fill="#efe6ff" stroke="#8250df" stroke-width="2"/>
    <text x="120" y="142" font-size="12.5" fill="#8250df" text-anchor="middle">shared</text>
    <rect x="60" y="164" width="120" height="34" rx="7" fill="#efe6ff" stroke="#8250df" stroke-width="2"/>
    <text x="120" y="186" font-size="12.5" fill="#8250df" text-anchor="middle">owner_a</text>
    <rect x="60" y="208" width="120" height="34" rx="7" fill="#efe6ff" stroke="#8250df" stroke-width="2"/>
    <text x="120" y="230" font-size="12.5" fill="#8250df" text-anchor="middle">owner_b</text>
  </g>
  <text x="120" y="262" font-size="11.5" fill="#57606a" text-anchor="middle">each an Rc::clone</text>

  <!-- arrows converge to the one allocation -->
  <line x1="180" y1="137" x2="360" y2="175" stroke="#8250df" stroke-width="2" marker-end="url(#p32)"/>
  <line x1="180" y1="181" x2="360" y2="185" stroke="#8250df" stroke-width="2" marker-end="url(#p32)"/>
  <line x1="180" y1="225" x2="360" y2="197" stroke="#8250df" stroke-width="2" marker-end="url(#p32)"/>

  <!-- the one heap allocation -->
  <text x="510" y="108" font-size="12.5" font-weight="700" fill="#57606a" text-anchor="middle">one heap allocation</text>
  <rect x="368" y="120" width="284" height="180" rx="12" fill="#efe6ff" stroke="#8250df" stroke-width="2"/>

  <!-- strong count -->
  <rect x="388" y="140" width="244" height="38" rx="7" fill="#fff" stroke="#8250df" stroke-width="1.5"/>
  <text x="404" y="164" font-size="12.5" fill="#8250df">strong count:</text>
  <text x="612" y="164" font-size="13" font-weight="700" font-family="ui-monospace,monospace" fill="#8250df" text-anchor="end">3</text>
  <text x="510" y="193" font-size="10.5" fill="#57606a" text-anchor="middle">how many OWNERS (Rc job)</text>

  <!-- refcell box -->
  <rect x="388" y="206" width="244" height="80" rx="9" fill="#fff8e8" stroke="#d4a72c" stroke-width="2"/>
  <text x="404" y="226" font-size="12" font-weight="700" fill="#9a6700">RefCell</text>
  <rect x="500" y="212" width="120" height="26" rx="6" fill="#fff3d4" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="516" y="230" font-size="11" fill="#9a6700">borrow flag:</text>
  <text x="612" y="230" font-size="12" font-weight="700" font-family="ui-monospace,monospace" fill="#9a6700" text-anchor="end">0</text>
  <rect x="404" y="246" width="216" height="30" rx="6" fill="#d7f5dd" stroke="#3fa45b" stroke-width="1.5"/>
  <text x="512" y="266" font-size="13" font-family="ui-monospace,monospace" fill="#1a7f37" text-anchor="middle">value: 15</text>
  <text x="510" y="299" font-size="0" fill="#57606a"></text>

  <!-- two-jobs footnote -->
  <text x="340" y="336" font-size="12.5" fill="#57606a" text-anchor="middle"><tspan font-family="ui-monospace,monospace" font-weight="700" fill="#8250df">Rc::clone</tspan> bumps the <tspan font-weight="700" fill="#8250df">strong count</tspan> · <tspan font-family="ui-monospace,monospace" font-weight="700" fill="#9a6700">.borrow_mut()</tspan> checks the <tspan font-weight="700" fill="#9a6700">borrow flag</tspan></text>
  <text x="340" y="358" font-size="12.5" fill="#57606a" text-anchor="middle">two counters, two independent jobs — a change through any owner is seen by all</text>
  <text x="340" y="388" font-size="12" font-style="italic" fill="#8a94a0" text-anchor="middle">(two live .borrow_mut() at once still panics — one RefCell, one borrow flag)</text>
</svg>
