<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="678" height="398" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="40" font-size="20" font-weight="700" fill="#1f2328">A trait is a contract — many different types can sign it</text>
  <text x="32" y="64" font-size="13" fill="#57606a">The trait names an ability; each type promises to provide it in its own way.</text>

  <!-- the trait / contract -->
  <text x="150" y="104" font-size="12" fill="#57606a" text-anchor="middle">THE CONTRACT</text>
  <rect x="40" y="118" width="220" height="118" rx="10" fill="#e7e0ff" stroke="#8a63d2" stroke-width="2"/>
  <text x="60" y="146" font-size="13.5" font-family="ui-monospace,monospace" fill="#5a3ea8">trait Greet {</text>
  <text x="60" y="168" font-size="13.5" font-family="ui-monospace,monospace" fill="#5a3ea8">   fn hello(&amp;self)</text>
  <text x="60" y="188" font-size="13.5" font-family="ui-monospace,monospace" fill="#5a3ea8">      -&gt; String;</text>
  <text x="60" y="210" font-size="13.5" font-family="ui-monospace,monospace" fill="#5a3ea8">}</text>
  <text x="150" y="228" font-size="11" fill="#5a3ea8" text-anchor="middle">"must have a hello()"</text>

  <!-- signers -->
  <text x="512" y="104" font-size="12" fill="#57606a" text-anchor="middle">THE SIGNERS</text>

  <rect x="392" y="118" width="256" height="56" rx="10" fill="#dbe9ff" stroke="#4a7fd6" stroke-width="2"/>
  <text x="408" y="142" font-size="12.5" font-family="ui-monospace,monospace" fill="#0b3d91">impl Greet for Dog {</text>
  <text x="408" y="162" font-size="12.5" font-family="ui-monospace,monospace" fill="#0b3d91">   hello() = "Woof!"  }</text>

  <rect x="392" y="188" width="256" height="56" rx="10" fill="#ffe9c9" stroke="#d98a3d" stroke-width="2"/>
  <text x="408" y="212" font-size="12.5" font-family="ui-monospace,monospace" fill="#8a5a1d">impl Greet for Cat {</text>
  <text x="408" y="232" font-size="12.5" font-family="ui-monospace,monospace" fill="#8a5a1d">   hello() = "Meow!"  }</text>

  <line x1="260" y1="160" x2="388" y2="146" stroke="#4a7fd6" stroke-width="1.5" marker-end="url(#arrb)"/>
  <line x1="260" y1="196" x2="388" y2="216" stroke="#d98a3d" stroke-width="1.5" marker-end="url(#arro)"/>
  <text x="322" y="150" font-size="10.5" fill="#57606a" text-anchor="middle">signs</text>
  <text x="322" y="228" font-size="10.5" fill="#57606a" text-anchor="middle">signs</text>

  <text x="32" y="300" font-size="13" fill="#1f2328" font-weight="700">Now anything that asks for "a type that implements Greet" accepts BOTH Dog and Cat —</text>
  <text x="32" y="320" font-size="13" fill="#1f2328">and calling <tspan font-family="ui-monospace,monospace">.hello()</tspan> runs whichever version that type signed up for.</text>
  <text x="32" y="352" font-size="12" fill="#8a94a0">The trait is the shared name for the ability. The impls are each type's own way of doing it.</text>

  <defs>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 z" fill="#4a7fd6"/></marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 z" fill="#d98a3d"/></marker>
  </defs>
</svg>
