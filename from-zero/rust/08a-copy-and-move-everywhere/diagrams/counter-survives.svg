<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="ui-sans-serif, system-ui, sans-serif">
  <style>
    .lbl   { fill: #64748b; font-size: 13px; }
    .var   { fill: #0f172a; font-size: 15px; font-weight: 600; }
    .val   { fill: #1e293b; font-size: 20px; font-weight: 700; }
    .note  { fill: #475569; font-size: 12px; font-style: italic; }
    .ok    { fill: #15803d; font-size: 13px; font-weight: 600; }
    .stage { fill: #64748b; font-size: 12px; letter-spacing: .08em; }
  </style>

  <!-- STAGE 1: n holds 3 -->
  <text class="stage" x="24" y="30">BEFORE THE LOOP</text>
  <rect x="24" y="44" width="150" height="90" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text class="var" x="40" y="70">n</text>
  <text class="lbl" x="40" y="90">usize · a number</text>
  <rect x="40" y="98" width="118" height="26" rx="5" fill="#c7d2fe" stroke="#6366f1" stroke-width="1.5"/>
  <text class="val" x="99" y="117" text-anchor="middle">3</text>

  <!-- arrow: copies the value -->
  <line x1="182" y1="89" x2="292" y2="89" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text class="note" x="237" y="78" text-anchor="middle">0..n copies</text>
  <text class="note" x="237" y="104" text-anchor="middle">the value in</text>

  <!-- STAGE 2: range gets its own copy -->
  <text class="stage" x="300" y="30">THE RANGE OBJECT</text>
  <rect x="300" y="44" width="180" height="90" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text class="var" x="316" y="70">0..n</text>
  <text class="lbl" x="316" y="90">its own copy of the end</text>
  <rect x="316" y="98" width="148" height="26" rx="5" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/>
  <text class="val" x="390" y="117" text-anchor="middle">start 0 · end 3</text>

  <!-- STAGE 3: after the loop, n still alive -->
  <text class="stage" x="560" y="30">AFTER THE LOOP</text>
  <rect x="560" y="44" width="150" height="90" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text class="var" x="576" y="70">n</text>
  <text class="ok" x="576" y="90">✓ still usable</text>
  <rect x="576" y="98" width="118" height="26" rx="5" fill="#c7d2fe" stroke="#6366f1" stroke-width="1.5"/>
  <text class="val" x="635" y="117" text-anchor="middle">3</text>

  <!-- dashed link: same n, untouched -->
  <line x1="99" y1="140" x2="99" y2="230" stroke="#c7d2fe" stroke-width="2"/>
  <line x1="99" y1="230" x2="635" y2="230" stroke="#c7d2fe" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="635" y1="230" x2="635" y2="140" stroke="#c7d2fe" stroke-width="2" marker-end="url(#b)"/>
  <text class="note" x="367" y="222" text-anchor="middle">same n, never moved — a copy went into the range, the original stayed put</text>

  <!-- bottom takeaway -->
  <text x="380" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#6366f1">A number is Copy, so 0..n copies it — the loop never eats n.</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c7d2fe"/>
    </marker>
  </defs>
</svg>
