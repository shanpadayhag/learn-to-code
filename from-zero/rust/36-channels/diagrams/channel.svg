<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="698" height="518" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="40" font-size="19" font-weight="700" fill="#1f2328">A channel — ownership travels down a pipe</text>
  <text x="32" y="63" font-size="13.5" fill="#57606a"><tspan font-family="ui-monospace,monospace" font-weight="700" fill="#bc4c00">send</tspan> moves the value out of a thread's stack · <tspan font-family="ui-monospace,monospace" font-weight="700" fill="#0969da">recv</tspan> moves it onto the receiver's — never two owners at once</text>

  <defs>
    <marker id="chIn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#bc4c00"/>
    </marker>
    <marker id="chOut" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0969da"/>
    </marker>
  </defs>

  <!-- producer stacks -->
  <text x="118" y="110" font-size="12" font-weight="700" fill="#bc4c00" text-anchor="middle">worker 1 — stack</text>
  <rect x="33" y="120" width="170" height="72" rx="9" fill="#fff1e7" stroke="#bc4c00" stroke-width="2"/>
  <rect x="50" y="136" width="136" height="30" rx="6" fill="#fff" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="118" y="156" font-size="11.5" font-family="ui-monospace,monospace" fill="#bc4c00" text-anchor="middle">sender.clone()</text>
  <text x="118" y="182" font-size="10.5" fill="#57606a" text-anchor="middle">already sent its value</text>

  <text x="118" y="250" font-size="12" font-weight="700" fill="#bc4c00" text-anchor="middle">worker 2 — stack</text>
  <rect x="33" y="260" width="170" height="72" rx="9" fill="#fff1e7" stroke="#bc4c00" stroke-width="2"/>
  <rect x="50" y="276" width="136" height="30" rx="6" fill="#fff" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="118" y="296" font-size="11.5" font-family="ui-monospace,monospace" fill="#bc4c00" text-anchor="middle">sender.clone()</text>
  <text x="118" y="322" font-size="10.5" fill="#57606a" text-anchor="middle">sending now…</text>

  <!-- the queue on the heap -->
  <text x="350" y="110" font-size="12.5" font-weight="700" fill="#1a7f37" text-anchor="middle">the channel — a queue on the heap</text>
  <rect x="248" y="122" width="204" height="210" rx="11" fill="#d7f5dd" stroke="#3fa45b" stroke-width="2"/>

  <rect x="268" y="146" width="164" height="34" rx="7" fill="#fff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="350" y="168" font-size="12" font-family="ui-monospace,monospace" fill="#1a7f37" text-anchor="middle">"worker 1 done"</text>
  <rect x="268" y="188" width="164" height="34" rx="7" fill="#fff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="350" y="210" font-size="12" font-family="ui-monospace,monospace" fill="#1a7f37" text-anchor="middle">"worker 2 done"</text>
  <rect x="268" y="230" width="164" height="34" rx="7" fill="#fff" stroke="#3fa45b" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="350" y="252" font-size="11" fill="#8a94a0" text-anchor="middle">empty slot</text>

  <text x="350" y="288" font-size="11" fill="#57606a" text-anchor="middle">first in, first out</text>
  <text x="350" y="312" font-size="11" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace">senders alive: 2</text>

  <!-- receiver stack -->
  <text x="582" y="180" font-size="12" font-weight="700" fill="#0969da" text-anchor="middle">main thread — stack</text>
  <rect x="497" y="190" width="170" height="104" rx="9" fill="#eaf2fb" stroke="#0969da" stroke-width="2"/>
  <rect x="514" y="206" width="136" height="30" rx="6" fill="#fff" stroke="#0969da" stroke-width="1.5"/>
  <text x="582" y="226" font-size="11.5" font-family="ui-monospace,monospace" fill="#0969da" text-anchor="middle">receiver</text>
  <rect x="514" y="242" width="136" height="30" rx="6" fill="#fff" stroke="#0969da" stroke-width="1.5"/>
  <text x="582" y="262" font-size="11.5" font-family="ui-monospace,monospace" fill="#0969da" text-anchor="middle">message: String</text>
  <text x="582" y="286" font-size="10.5" fill="#0969da" text-anchor="middle">owns it now</text>

  <!-- arrows -->
  <line x1="203" y1="156" x2="244" y2="160" stroke="#bc4c00" stroke-width="2.2" marker-end="url(#chIn)"/>
  <line x1="203" y1="292" x2="244" y2="245" stroke="#bc4c00" stroke-width="2.2" marker-end="url(#chIn)"/>
  <line x1="452" y1="163" x2="493" y2="215" stroke="#0969da" stroke-width="2.2" marker-end="url(#chOut)"/>
  <text x="222" y="128" font-size="11" font-weight="700" fill="#bc4c00" text-anchor="middle" font-family="ui-monospace,monospace">send</text>
  <text x="480" y="150" font-size="11" font-weight="700" fill="#0969da" text-anchor="middle" font-family="ui-monospace,monospace">recv</text>

  <text x="350" y="386" font-size="12" fill="#57606a" text-anchor="middle">for a String, only the owner (ptr · len · cap) travels — the text buffer never moves, it is just re-owned</text>
  <text x="350" y="414" font-size="12" fill="#57606a" text-anchor="middle">no lock anywhere: the value belongs to exactly one place at every instant, so nothing needs guarding</text>
  <text x="350" y="452" font-size="12" font-style="italic" fill="#8a94a0" text-anchor="middle">when the last sender drops, "senders alive" hits 0 → the channel closes → the receiver's loop ends</text>
  <text x="350" y="480" font-size="12" font-style="italic" fill="#8a94a0" text-anchor="middle">forget to drop main's own sender and the count never reaches 0 — the loop waits forever</text>
</svg>
