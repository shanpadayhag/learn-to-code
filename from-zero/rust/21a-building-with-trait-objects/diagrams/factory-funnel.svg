<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="438" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="40" font-size="20" font-weight="700" fill="#1f2328">make_shape funnels many types into ONE return type</text>
  <text x="32" y="64" font-size="13" fill="#57606a">Three different structs, one common shape: Option&lt;Box&lt;dyn Shape&gt;&gt;. That sameness is what lets one function return any of them.</text>

  <!-- three different structs -->
  <text x="130" y="106" font-size="12" fill="#57606a" text-anchor="middle">DIFFERENT TYPES (different sizes)</text>
  <rect x="40" y="120" width="200" height="34" rx="8" fill="#ffe9c9" stroke="#d98a3d" stroke-width="2"/>
  <text x="56" y="142" font-size="12.5" fill="#8a5a1d">Rectangle { width, height }</text>
  <rect x="40" y="166" width="200" height="34" rx="8" fill="#d9f2e6" stroke="#3aa06a" stroke-width="2"/>
  <text x="56" y="188" font-size="12.5" fill="#1d6b45">Triangle { base, height }</text>
  <rect x="40" y="212" width="200" height="34" rx="8" fill="#dbe9ff" stroke="#4a7fd6" stroke-width="2"/>
  <text x="56" y="234" font-size="12.5" fill="#0b3d91">Circle { radius }</text>

  <!-- box wrap step -->
  <text x="360" y="106" font-size="12" fill="#57606a" text-anchor="middle">Box::new(...) → one pointer size</text>
  <rect x="300" y="150" width="120" height="66" rx="10" fill="#e7e0ff" stroke="#8a63d2" stroke-width="2"/>
  <text x="360" y="178" font-size="13" fill="#5a3ea8" text-anchor="middle">Box&lt;dyn Shape&gt;</text>
  <text x="360" y="198" font-size="11" fill="#5a3ea8" text-anchor="middle">"some Shape"</text>

  <line x1="240" y1="137" x2="298" y2="172" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="240" y1="183" x2="298" y2="183" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="240" y1="229" x2="298" y2="194" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- option wrap -->
  <text x="560" y="106" font-size="12" fill="#57606a" text-anchor="middle">...or nothing, if the name is junk</text>
  <rect x="470" y="140" width="170" height="44" rx="10" fill="#fff3cf" stroke="#d9b23d" stroke-width="2"/>
  <text x="555" y="167" font-size="13" fill="#8a6d1d" text-anchor="middle">Some(box)</text>
  <rect x="470" y="196" width="170" height="34" rx="10" fill="#eef1f4" stroke="#c4ccd4"/>
  <text x="555" y="218" font-size="12.5" fill="#57606a" text-anchor="middle">None  ← unknown name</text>
  <line x1="420" y1="183" x2="468" y2="168" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- consumer -->
  <text x="32" y="300" font-size="13" fill="#1f2328" font-weight="600">main() never asks "which shape?" — it only handles the two Option cases:</text>
  <rect x="40" y="316" width="600" height="70" rx="10" fill="#eef1f4" stroke="#c4ccd4"/>
  <text x="58" y="344" font-size="12.5" font-family="ui-monospace,monospace" fill="#1f2328">match make_shape(name) {</text>
  <text x="58" y="364" font-size="12.5" font-family="ui-monospace,monospace" fill="#1d6b45">    Some(shape) => println!("Area: {:.2}", shape.area()),</text>
  <text x="58" y="382" font-size="12.5" font-family="ui-monospace,monospace" fill="#8a5a1d">    None => println!("Invalid shape"),  }</text>

  <text x="32" y="414" font-size="12" fill="#57606a">Add a Square later? One new struct + impl + one make_shape arm. main() doesn't change at all.</text>
</svg>
