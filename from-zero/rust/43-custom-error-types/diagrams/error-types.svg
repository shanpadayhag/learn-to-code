<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 790" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="698" height="788" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="40" font-size="19" font-weight="700" fill="#1f2328">An error type is a shape the caller can act on.</text>
  <text x="32" y="63" font-size="13.5" fill="#57606a">A message can only be printed. A named variant can be answered.</text>

  <defs>
    <marker id="etArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#57606a"/>
    </marker>
    <marker id="etGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <!-- (1) one door vs three -->
  <rect x="30" y="86" width="640" height="208" rx="11" fill="#fff" stroke="#d0d7de"/>
  <text x="48" y="112" font-size="13.5" font-weight="700" fill="#8250df">① what reaches the caller</text>

  <rect x="50" y="126" width="296" height="152" rx="9" fill="#fff1e7" stroke="#bc4c00" stroke-width="2"/>
  <text x="198" y="147" font-size="11.5" font-weight="700" fill="#bc4c00" text-anchor="middle" font-family="ui-monospace,monospace">Box&lt;dyn Error&gt;</text>
  <rect x="70" y="159" width="256" height="34" rx="7" fill="#fff" stroke="#bc4c00"/>
  <text x="198" y="180" font-size="10.5" fill="#57606a" text-anchor="middle">"invalid digit found in string"</text>
  <text x="198" y="212" font-size="10" fill="#57606a" text-anchor="middle">every failure arrives as one shape</text>
  <text x="198" y="234" font-size="10" fill="#bc4c00" text-anchor="middle">can print it ✓</text>
  <text x="198" y="252" font-size="10" fill="#cf222e" text-anchor="middle">cannot tell a typo from an offline sensor ✗</text>
  <text x="198" y="270" font-size="9.5" font-style="italic" fill="#57606a" text-anchor="middle">right for main() and small tools</text>

  <rect x="366" y="126" width="284" height="152" rx="9" fill="#eafaef" stroke="#1a7f37" stroke-width="2"/>
  <text x="508" y="147" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="middle" font-family="ui-monospace,monospace">enum ReadingError</text>
  <rect x="382" y="157" width="252" height="20" rx="5" fill="#fff" stroke="#1a7f37"/>
  <text x="392" y="171" font-size="9.5" font-family="ui-monospace,monospace" fill="#57606a">NotANumber(cause)      → skip</text>
  <rect x="382" y="181" width="252" height="20" rx="5" fill="#fff" stroke="#1a7f37"/>
  <text x="392" y="195" font-size="9.5" font-family="ui-monospace,monospace" fill="#57606a">OutOfRange{value,limit} → clamp</text>
  <rect x="382" y="205" width="252" height="20" rx="5" fill="#fff" stroke="#1a7f37"/>
  <text x="392" y="219" font-size="9.5" font-family="ui-monospace,monospace" fill="#57606a">SensorOffline{name}     → retry</text>
  <text x="508" y="243" font-size="10" fill="#1a7f37" text-anchor="middle">three variants, three reactions</text>
  <text x="508" y="261" font-size="10" fill="#1a7f37" text-anchor="middle">exhaustive — a new variant breaks the match ✓</text>
  <text x="508" y="270" font-size="9.5" font-style="italic" fill="#57606a" text-anchor="middle"></text>

  <!-- (2) ? runs From::from -->
  <rect x="30" y="308" width="640" height="216" rx="11" fill="#fff" stroke="#d0d7de"/>
  <text x="48" y="334" font-size="13.5" font-weight="700" fill="#8250df">② the one line that makes <tspan font-family="ui-monospace,monospace">?</tspan> convert</text>

  <rect x="50" y="350" width="180" height="26" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="140" y="368" font-size="10" font-family="ui-monospace,monospace" fill="#57606a" text-anchor="middle">ParseIntError</text>
  <rect x="50" y="384" width="180" height="26" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="140" y="402" font-size="10" font-family="ui-monospace,monospace" fill="#57606a" text-anchor="middle">io::Error</text>
  <rect x="50" y="418" width="180" height="26" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="140" y="436" font-size="10" font-family="ui-monospace,monospace" fill="#57606a" text-anchor="middle">Utf8Error</text>

  <path d="M236,363 L286,391" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#etArrow)"/>
  <path d="M236,397 L286,397" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#etArrow)"/>
  <path d="M236,431 L286,403" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#etArrow)"/>

  <rect x="294" y="374" width="130" height="46" rx="8" fill="#f5f0ff" stroke="#8250df" stroke-width="2"/>
  <text x="359" y="394" font-size="11" font-weight="700" fill="#8250df" text-anchor="middle" font-family="ui-monospace,monospace">?</text>
  <text x="359" y="411" font-size="9.5" fill="#8250df" text-anchor="middle">calls From::from</text>

  <path d="M430,397 L484,397" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#etGreen)"/>

  <rect x="492" y="374" width="158" height="46" rx="8" fill="#eafaef" stroke="#1a7f37" stroke-width="2"/>
  <text x="571" y="401" font-size="10.5" font-weight="700" fill="#1a7f37" text-anchor="middle" font-family="ui-monospace,monospace">ReadingError</text>

  <rect x="50" y="458" width="600" height="50" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="66" y="478" font-size="10.5" font-family="ui-monospace,monospace" fill="#57606a">impl From&lt;ParseIntError&gt; for ReadingError { ... }</text>
  <text x="66" y="497" font-size="10" fill="#57606a">One impl per incoming error type. Write it, and <tspan font-family="ui-monospace,monospace">?</tspan> converts silently forever after.</text>

  <!-- (3) what Result pays -->
  <rect x="30" y="538" width="640" height="228" rx="11" fill="#fff" stroke="#d0d7de"/>
  <text x="48" y="564" font-size="13.5" font-weight="700" fill="#8250df">③ the size a Result carries on every call — success included</text>

  <text x="50" y="588" font-size="10.5" font-family="ui-monospace,monospace" fill="#1f2328">Result&lt;i32, ReadingError&gt;</text>
  <rect x="50" y="596" width="336" height="32" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
  <text x="218" y="617" font-size="10.5" fill="#cf222e" text-anchor="middle">24 bytes — as wide as SensorOffline{String}</text>
  <text x="398" y="617" font-size="10" fill="#57606a">an Ok(21) still occupies all 24</text>

  <text x="50" y="654" font-size="10.5" font-family="ui-monospace,monospace" fill="#1f2328">Result&lt;i32, Box&lt;dyn Error&gt;&gt;</text>
  <rect x="50" y="662" width="224" height="32" rx="6" fill="#eafaef" stroke="#1a7f37" stroke-width="2"/>
  <text x="162" y="683" font-size="10.5" fill="#1a7f37" text-anchor="middle">16 bytes — data ptr + vtable ptr</text>
  <text x="286" y="683" font-size="10" fill="#57606a">the error's bulk moves to the heap,</text>
  <text x="286" y="696" font-size="10" fill="#57606a">and is only allocated when it fails</text>

  <text x="50" y="726" font-size="10.5" font-family="ui-monospace,monospace" fill="#1f2328">Result&lt;(), std::io::Error&gt;</text>
  <rect x="50" y="734" width="112" height="26" rx="6" fill="#eafaef" stroke="#1a7f37" stroke-width="2"/>
  <text x="106" y="752" font-size="10.5" fill="#1a7f37" text-anchor="middle">8 bytes</text>
  <text x="176" y="752" font-size="10" fill="#57606a">std boxes its own error internally, on purpose, for exactly this reason</text>
</svg>
