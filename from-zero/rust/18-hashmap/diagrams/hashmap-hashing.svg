<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="678" height="418" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="40" font-size="20" font-weight="700" fill="#1f2328">A key is hashed into a slot number — then you jump straight there</text>
  <text x="32" y="64" font-size="14" fill="#57606a">scores.get(<tspan font-family="ui-monospace,monospace" fill="#0b3d91">"Alice"</tspan>)  <tspan fill="#8a94a0">// no scanning — go directly to the slot</tspan></text>

  <!-- the key -->
  <rect x="40" y="150" width="120" height="44" rx="8" fill="#dbe9ff" stroke="#4a7fd6" stroke-width="2"/>
  <text x="100" y="178" font-size="15" font-family="ui-monospace,monospace" fill="#0b3d91" text-anchor="middle">"Alice"</text>
  <text x="100" y="138" font-size="12" fill="#57606a" text-anchor="middle">key (K)</text>

  <!-- arrow to hash fn -->
  <line x1="160" y1="172" x2="212" y2="172" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- hash function -->
  <rect x="214" y="146" width="150" height="52" rx="10" fill="#e7e0ff" stroke="#8a63d2" stroke-width="2"/>
  <text x="289" y="170" font-size="13" font-weight="700" fill="#5a3ea8" text-anchor="middle">hash("Alice")</text>
  <text x="289" y="188" font-size="12" font-family="ui-monospace,monospace" fill="#5a3ea8" text-anchor="middle">= …7314 → slot 3</text>

  <!-- arrow to slots -->
  <line x1="364" y1="172" x2="416" y2="172" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- heap slot buffer -->
  <text x="548" y="112" font-size="12" fill="#57606a" text-anchor="middle">HEAP — the slot buffer</text>
  <g font-family="ui-monospace,monospace" font-size="13">
    <rect x="420" y="124" width="230" height="34" rx="6" fill="#fff" stroke="#a9b2bd"/><text x="432" y="146" fill="#8a94a0">slot 0 · empty</text>
    <rect x="420" y="162" width="230" height="34" rx="6" fill="#fff" stroke="#a9b2bd"/><text x="432" y="184" fill="#8a94a0">slot 1 · empty</text>
    <rect x="420" y="200" width="230" height="34" rx="6" fill="#fff" stroke="#a9b2bd"/><text x="432" y="222" fill="#8a94a0">slot 2 · empty</text>
    <rect x="420" y="238" width="230" height="34" rx="6" fill="#fff3d6" stroke="#d98a3d" stroke-width="2"/><text x="432" y="260" fill="#8a5a1d">slot 3 · "Alice" → 88</text>
    <rect x="420" y="276" width="230" height="34" rx="6" fill="#fff" stroke="#a9b2bd"/><text x="432" y="298" fill="#8a94a0">slot 4 · empty</text>
    <rect x="420" y="314" width="230" height="34" rx="6" fill="#fff3d6" stroke="#d98a3d"/><text x="432" y="336" fill="#8a5a1d">slot 5 · "Bob" → 92</text>
  </g>

  <!-- landing arrow -->
  <line x1="416" y1="172" x2="416" y2="255" stroke="#d98a3d" stroke-width="2"/>
  <line x1="416" y1="255" x2="418" y2="255" stroke="#d98a3d" stroke-width="2" marker-end="url(#arr2)"/>

  <text x="40" y="272" font-size="13" fill="#57606a">The same hash on insert</text>
  <text x="40" y="292" font-size="13" fill="#57606a">and on lookup lands on</text>
  <text x="40" y="312" font-size="13" fill="#57606a">the <tspan font-weight="700" fill="#8a5a1d">same slot</tspan> — so the</text>
  <text x="40" y="332" font-size="13" fill="#57606a">map never searches.</text>

  <text x="32" y="392" font-size="12" fill="#8a94a0">Lookup cost stays ~constant (O(1)) no matter how many pairs the map holds.</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#57606a"/></marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d98a3d"/></marker>
  </defs>
</svg>
