<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="698" height="698" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="40" font-size="19" font-weight="700" fill="#1f2328">A plain function is a stack frame. An async function is a struct.</text>
  <text x="32" y="63" font-size="13.5" fill="#57606a">A frame must run to completion. A <tspan font-family="ui-monospace,monospace" font-weight="700" fill="#8250df">state machine</tspan> is a value you can hold and pick up again.</text>

  <defs>
    <marker id="afRun" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1a7f37"/>
    </marker>
    <marker id="afHold" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8250df"/>
    </marker>
  </defs>

  <!-- (1) plain fn -->
  <rect x="30" y="86" width="640" height="176" rx="11" fill="#fff" stroke="#d0d7de"/>
  <text x="48" y="112" font-size="13.5" font-weight="700" fill="#1a7f37">① <tspan font-family="ui-monospace,monospace">fn brew()</tspan> — the locals live in a frame that is born and dies</text>

  <text x="130" y="136" font-size="11" fill="#57606a" text-anchor="middle">before the call</text>
  <rect x="55" y="146" width="150" height="88" rx="9" fill="#f6f8fa" stroke="#8a94a0" stroke-width="1.6"/>
  <rect x="70" y="200" width="120" height="26" rx="5" fill="#fff" stroke="#8a94a0" stroke-width="1.3"/>
  <text x="130" y="218" font-size="11" font-family="ui-monospace,monospace" fill="#57606a" text-anchor="middle">main</text>

  <text x="350" y="136" font-size="11" fill="#1a7f37" text-anchor="middle">during the call</text>
  <rect x="275" y="146" width="150" height="88" rx="9" fill="#eafaef" stroke="#1a7f37" stroke-width="1.8"/>
  <rect x="290" y="160" width="120" height="34" rx="5" fill="#fff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="350" y="175" font-size="10.5" font-family="ui-monospace,monospace" fill="#1a7f37" text-anchor="middle">brew's frame</text>
  <text x="350" y="188" font-size="9.5" font-family="ui-monospace,monospace" fill="#57606a" text-anchor="middle">beans, cup</text>
  <rect x="290" y="200" width="120" height="26" rx="5" fill="#fff" stroke="#8a94a0" stroke-width="1.3"/>
  <text x="350" y="218" font-size="11" font-family="ui-monospace,monospace" fill="#57606a" text-anchor="middle">main</text>

  <text x="570" y="136" font-size="11" fill="#57606a" text-anchor="middle">after the call</text>
  <rect x="495" y="146" width="150" height="88" rx="9" fill="#f6f8fa" stroke="#8a94a0" stroke-width="1.6"/>
  <rect x="510" y="160" width="120" height="34" rx="5" fill="#fff" stroke="#8a94a0" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="570" y="181" font-size="10.5" fill="#8a94a0" text-anchor="middle">frame gone</text>
  <rect x="510" y="200" width="120" height="26" rx="5" fill="#fff" stroke="#8a94a0" stroke-width="1.3"/>
  <text x="570" y="218" font-size="11" font-family="ui-monospace,monospace" fill="#57606a" text-anchor="middle">main</text>

  <line x1="212" y1="190" x2="268" y2="190" stroke="#1a7f37" stroke-width="2" marker-end="url(#afRun)"/>
  <line x1="432" y1="190" x2="488" y2="190" stroke="#1a7f37" stroke-width="2" marker-end="url(#afRun)"/>
  <text x="350" y="254" font-size="11.5" fill="#57606a" text-anchor="middle">there is no moment where the frame exists and is <tspan font-style="italic">not</tspan> running — it cannot be paused</text>

  <!-- (2) async fn -->
  <rect x="30" y="278" width="640" height="200" rx="11" fill="#fff" stroke="#d0d7de"/>
  <text x="48" y="304" font-size="13.5" font-weight="700" fill="#8250df">② <tspan font-family="ui-monospace,monospace">async fn brew()</tspan> — calling it builds a value and runs nothing</text>

  <text x="150" y="330" font-size="11" fill="#57606a" text-anchor="middle"><tspan font-family="ui-monospace,monospace">let f = brew("arabica");</tspan></text>
  <rect x="55" y="342" width="190" height="112" rx="9" fill="#f6f8fa" stroke="#8a94a0" stroke-width="1.6"/>
  <text x="150" y="360" font-size="10.5" fill="#57606a" text-anchor="middle">main's frame</text>
  <rect x="72" y="368" width="156" height="72" rx="7" fill="#f5f0ff" stroke="#8250df" stroke-width="2"/>
  <text x="150" y="385" font-size="10.5" font-family="ui-monospace,monospace" font-weight="700" fill="#8250df" text-anchor="middle">f — the future</text>
  <rect x="84" y="392" width="132" height="18" rx="4" fill="#fff" stroke="#8250df" stroke-width="1.2"/>
  <text x="150" y="405" font-size="9.5" font-family="ui-monospace,monospace" fill="#8250df" text-anchor="middle">state: NotStarted</text>
  <rect x="84" y="414" width="132" height="18" rx="4" fill="#fff" stroke="#8250df" stroke-width="1.2"/>
  <text x="150" y="427" font-size="9.5" font-family="ui-monospace,monospace" fill="#57606a" text-anchor="middle">beans: "arabica"</text>

  <line x1="252" y1="398" x2="318" y2="398" stroke="#8250df" stroke-width="2.2" marker-end="url(#afHold)"/>
  <text x="285" y="391" font-size="10" fill="#8250df" text-anchor="middle">poll</text>

  <rect x="325" y="342" width="190" height="112" rx="9" fill="#f5f0ff" stroke="#8250df" stroke-width="2"/>
  <text x="420" y="360" font-size="10.5" fill="#8250df" text-anchor="middle">after one poll — paused</text>
  <rect x="342" y="368" width="156" height="72" rx="7" fill="#fff" stroke="#8250df" stroke-width="1.6"/>
  <rect x="354" y="378" width="132" height="18" rx="4" fill="#f5f0ff" stroke="#8250df" stroke-width="1.2"/>
  <text x="420" y="391" font-size="9.5" font-family="ui-monospace,monospace" font-weight="700" fill="#8250df" text-anchor="middle">state: AtAwait1</text>
  <rect x="354" y="400" width="132" height="18" rx="4" fill="#f6f8fa" stroke="#8a94a0" stroke-width="1.1"/>
  <text x="420" y="413" font-size="9.5" font-family="ui-monospace,monospace" fill="#57606a" text-anchor="middle">beans: "arabica"</text>
  <rect x="354" y="422" width="132" height="18" rx="4" fill="#f6f8fa" stroke="#8a94a0" stroke-width="1.1"/>
  <text x="420" y="435" font-size="9.5" font-family="ui-monospace,monospace" fill="#57606a" text-anchor="middle">cup: "arabica coffee"</text>

  <line x1="522" y1="398" x2="578" y2="398" stroke="#8250df" stroke-width="2.2" marker-end="url(#afHold)"/>
  <text x="550" y="391" font-size="10" fill="#8250df" text-anchor="middle">poll</text>

  <rect x="585" y="368" width="70" height="60" rx="7" fill="#eafaef" stroke="#1a7f37" stroke-width="1.8"/>
  <text x="620" y="393" font-size="10" font-family="ui-monospace,monospace" fill="#1a7f37" text-anchor="middle">Ready</text>
  <text x="620" y="408" font-size="9.5" font-family="ui-monospace,monospace" fill="#57606a" text-anchor="middle">String</text>

  <text x="350" y="470" font-size="11.5" fill="#57606a" text-anchor="middle">the locals are <tspan font-weight="700">fields</tspan>, so they survive the pause — the struct is the frame, made into a value</text>

  <!-- (3) nesting -->
  <rect x="30" y="494" width="640" height="180" rx="11" fill="#fff" stroke="#d0d7de"/>
  <text x="48" y="520" font-size="13.5" font-weight="700" fill="#0969da">③ every <tspan font-family="ui-monospace,monospace">.await</tspan> nests one future inside the next — one flat struct, sized at compile time</text>

  <rect x="60" y="534" width="330" height="122" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="225" y="552" font-size="10.5" font-family="ui-monospace,monospace" font-weight="700" fill="#0969da" text-anchor="middle">level_c's future — 4 bytes</text>
  <rect x="80" y="560" width="290" height="88" rx="7" fill="#fff" stroke="#0969da" stroke-width="1.6"/>
  <text x="225" y="577" font-size="10.5" font-family="ui-monospace,monospace" fill="#0969da" text-anchor="middle">level_b's future — 3 bytes</text>
  <rect x="100" y="584" width="250" height="56" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/>
  <text x="225" y="601" font-size="10.5" font-family="ui-monospace,monospace" fill="#0969da" text-anchor="middle">level_a's future — 2 bytes</text>
  <rect x="120" y="608" width="210" height="24" rx="5" fill="#fff" stroke="#0969da" stroke-width="1.2"/>
  <text x="225" y="624" font-size="10" font-family="ui-monospace,monospace" fill="#57606a" text-anchor="middle">nothing's future — 1 byte</text>

  <text x="530" y="562" font-size="11.5" fill="#57606a" text-anchor="middle">each layer adds only</text>
  <text x="530" y="578" font-size="11.5" fill="#57606a" text-anchor="middle">its own state tag and</text>
  <text x="530" y="594" font-size="11.5" fill="#57606a" text-anchor="middle">its own saved locals</text>
  <rect x="437" y="608" width="186" height="34" rx="7" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="530" y="629" font-size="11" font-weight="700" fill="#9a6700" text-anchor="middle">no stack. no allocation.</text>

  <text x="350" y="688" font-size="11" fill="#8a94a0" text-anchor="middle">a thread costs a 2 MiB stack whether it is working or waiting · a paused task costs exactly these bytes</text>
</svg>
