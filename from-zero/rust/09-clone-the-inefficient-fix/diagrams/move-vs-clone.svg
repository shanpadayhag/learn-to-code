<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="658" height="358" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="42" font-size="20" font-weight="700" fill="#1f2328">move vs clone — same goal, very different cost</text>
  <text x="32" y="66" font-size="14" fill="#57606a">both give s2 the text; they differ in what happens to s1 and to the heap</text>

  <!-- LEFT: move -->
  <text x="175" y="102" font-size="14" fill="#1f2328" font-weight="700" text-anchor="middle">let s2 = s1;  (move)</text>
  <text x="70" y="140" font-size="12" fill="#b0b6bd" font-family="ui-monospace,monospace">s1</text>
  <rect x="60" y="148" width="90" height="26" rx="5" fill="#eceff2" stroke="#c4cad1" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="105" y="166" font-size="10" fill="#b0b6bd" text-anchor="middle" font-family="ui-monospace,monospace">handle ✗</text>
  <text x="70" y="200" font-size="12" fill="#1f2328" font-family="ui-monospace,monospace">s2</text>
  <rect x="60" y="208" width="90" height="26" rx="5" fill="#dbe9ff" stroke="#4a7fd6" stroke-width="2"/>
  <text x="105" y="226" font-size="10" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace">handle ✓</text>
  <rect x="190" y="176" width="110" height="44" rx="8" fill="#fff4e6" stroke="#d98a2b" stroke-width="2"/>
  <text x="245" y="203" font-size="16" fill="#a35a05" text-anchor="middle" font-weight="700" font-family="ui-monospace,monospace">hello</text>
  <line x1="150" y1="221" x2="188" y2="204" stroke="#4a7fd6" stroke-width="2"/>
  <polygon points="188,204 178,203 181,213" fill="#4a7fd6"/>
  <text x="180" y="256" font-size="12" fill="#3f7a4b" text-anchor="middle" font-weight="700">1 buffer · few bytes copied</text>
  <text x="180" y="274" font-size="12" fill="#c1442e" text-anchor="middle">s1 retired</text>

  <line x1="330" y1="90" x2="330" y2="300" stroke="#d0d7de" stroke-dasharray="4 4"/>

  <!-- RIGHT: clone -->
  <text x="495" y="102" font-size="14" fill="#1f2328" font-weight="700" text-anchor="middle">let s2 = s1.clone();  (clone)</text>
  <text x="392" y="140" font-size="12" fill="#1f2328" font-family="ui-monospace,monospace">s1</text>
  <rect x="382" y="148" width="90" height="26" rx="5" fill="#dbe9ff" stroke="#4a7fd6" stroke-width="2"/>
  <text x="427" y="166" font-size="10" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace">handle ✓</text>
  <text x="392" y="200" font-size="12" fill="#1f2328" font-family="ui-monospace,monospace">s2</text>
  <rect x="382" y="208" width="90" height="26" rx="5" fill="#dbe9ff" stroke="#4a7fd6" stroke-width="2"/>
  <text x="427" y="226" font-size="10" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace">handle ✓</text>
  <rect x="512" y="140" width="110" height="40" rx="8" fill="#fff4e6" stroke="#d98a2b" stroke-width="2"/>
  <text x="567" y="165" font-size="15" fill="#a35a05" text-anchor="middle" font-weight="700" font-family="ui-monospace,monospace">hello</text>
  <rect x="512" y="200" width="110" height="40" rx="8" fill="#fff4e6" stroke="#d98a2b" stroke-width="2"/>
  <text x="567" y="225" font-size="15" fill="#a35a05" text-anchor="middle" font-weight="700" font-family="ui-monospace,monospace">hello</text>
  <line x1="472" y1="160" x2="510" y2="160" stroke="#4a7fd6" stroke-width="2"/><polygon points="510,160 500,155 500,165" fill="#4a7fd6"/>
  <line x1="472" y1="221" x2="510" y2="220" stroke="#4a7fd6" stroke-width="2"/><polygon points="510,220 500,215 500,225" fill="#4a7fd6"/>
  <text x="500" y="266" font-size="12" fill="#c1442e" text-anchor="middle" font-weight="700">2 buffers · every byte copied</text>
  <text x="500" y="284" font-size="12" fill="#3f7a4b" text-anchor="middle">both usable &amp; independent</text>

  <line x1="32" y1="316" x2="628" y2="316" stroke="#e1e4e8"/>
  <text x="330" y="344" font-size="13" fill="#57606a" text-anchor="middle">Reach for clone only when you truly need two owners — not just to dodge a move error.</text>
</svg>
